<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>귀시무담 | 불러오기</title>
<style>
@import url("https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css");
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09090a url('game.png') center center / cover no-repeat fixed;color:#f5f1ed;font-family:"Galmuri11","Galmuri9","DungGeunMo",monospace;image-rendering:pixelated}
body::before{content:"";position:fixed;inset:0;background:transparent;pointer-events:none}
body::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.24);z-index:0;pointer-events:none}
.screen{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;padding:clamp(18px,5vw,65px)}
.panel{width:min(760px,94vw);filter:drop-shadow(0 7px 0 #080808);}
.frame{border:3px solid #e6e6e6;box-shadow:inset 0 0 0 3px #262626,0 0 0 3px #222;background:repeating-linear-gradient(to bottom,#545454 0,#545454 6px,#515151 6px,#515151 12px,#4b4b4b 12px,#4b4b4b 18px);}
.heading{height:83px;padding:19px 24px;font-size:clamp(22px,3vw,33px);text-shadow:3px 3px #191919;display:flex;align-items:center}
.divider{height:20px}
.slot{width:100%;min-height:146px;padding:18px 24px;display:flex;align-items:center;gap:20px;text-align:left;color:inherit;cursor:pointer;font:inherit;transition:filter .12s}
.slot:hover,.slot:focus-visible{filter:brightness(1.23);outline:0}
.slot:focus-visible .slot-name,.slot:hover .slot-name{outline:2px solid #ddd;outline-offset:3px}
.slot-name{display:inline-block;font-size:clamp(22px,3vw,30px);text-shadow:2px 2px #151515;margin-bottom:12px}
.meta{font-size:clamp(15px,2vw,20px);color:#e3dfdd;line-height:1.7;text-shadow:1px 1px #111}
.empty{color:#ccc}.arrow{margin-left:auto;font-size:24px;opacity:0}.slot:hover .arrow,.slot:focus-visible .arrow{opacity:1}
.footer{margin-top:26px;display:flex;justify-content:space-between;gap:12px;align-items:center;color:#ddd;font-size:15px;text-shadow:1px 1px #000}
.back{border:2px solid #bdbdbd;background:#252525c9;color:#eee;font:inherit;font-size:16px;padding:9px 18px;cursor:pointer}.back:hover{background:#555}
.modal{z-index:10;position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}
.dialog{width:min(470px,92vw);padding:23px;background:#333;color:#f7f7f7;border:3px solid #eee;box-shadow:inset 0 0 0 3px #171717,6px 6px #000;font-size:19px;line-height:1.65}
.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}.actions button{background:#222;color:white;border:2px solid #ddd;padding:8px 18px;font:inherit;font-size:17px;cursor:pointer}.actions button:hover,.actions button:focus-visible{background:#e6e6e6;color:#111}
@media(max-width:500px){.heading{height:70px}.slot{min-height:120px}.footer{font-size:12px}.back{font-size:13px}}
</style></head><body>
<main class="screen"><div class="panel"><header class="frame heading">세이브 파일을 불러옵니다.</header><div class="divider" aria-hidden="true"></div>
<button class="frame slot" id="saveSlot" type="button" aria-label="세이브 파일 1 불러오기"><div><div class="slot-name">세이브 파일 1</div><div class="meta" id="slotMeta">빈 저장 파일</div></div><span class="arrow">▶</span></button>
<div class="footer"><span>불러올 세이브 파일을 선택하세요.</span><button class="back" id="backBtn" type="button">돌아가기</button></div></div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="question"><div class="dialog"><div id="question">불러오시겠습니까?</div><div class="actions"><button type="button" id="cancel">취소</button><button type="button" id="confirm">불러오기</button></div></div></div>
<script>
(function(){'use strict';
 // 메인 메뉴와 동일한 딸깍 소리: 버튼에 커서 진입 및 클릭 시 재생
let audioContext;
function unlockAudio() {
  try {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  } catch (_) {}
}
document.addEventListener('pointerdown', unlockAudio, { capture: true });
document.addEventListener('keydown', unlockAudio, { capture: true });
function playMenuClick() {
  if (!audioContext || audioContext.state !== 'running') return;
  const duration = 0.035;
  const buffer = audioContext.createBuffer(1, Math.ceil(audioContext.sampleRate * duration), audioContext.sampleRate);
  const samples = buffer.getChannelData(0);
  for (let i = 0; i < samples.length; i++) {
    const t = i / audioContext.sampleRate;
    samples[i] = (Math.random() * 2 - 1) * Math.exp(-t * 180);
  }
  const source = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const gain = audioContext.createGain();
  source.buffer = buffer;
  filter.type = 'bandpass'; filter.frequency.value = 1900; filter.Q.value = 0.75;
  gain.gain.value = 0.22;
  source.connect(filter); filter.connect(gain); gain.connect(audioContext.destination);
  source.onended = () => { source.disconnect(); filter.disconnect(); gain.disconnect(); };
  source.start();
}

 const soundTargets = document.querySelectorAll('button');
 soundTargets.forEach(button => {
   button.addEventListener('pointerenter', () => { unlockAudio(); playMenuClick(); });
   button.addEventListener('click', () => { unlockAudio(); playMenuClick(); }, {capture:true});
 });

 const KEY='gwisimudam_save_slot_1';const slot=document.getElementById('saveSlot'),meta=document.getElementById('slotMeta'),modal=document.getElementById('modal'),question=document.getElementById('question'),confirm=document.getElementById('confirm');
 let previousFocus=null;
 function existing(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
 function render(){const data=existing();meta.textContent=data?.savedAt?'저장 일시  '+new Date(data.savedAt).toLocaleString('ko-KR'):'빈 저장 파일';meta.classList.toggle('empty',!data);}
 function open(){previousFocus=document.activeElement;question.textContent='불러오시겠습니까?';confirm.textContent='불러오기';document.getElementById('cancel').style.display='';modal.classList.add('open');confirm.focus()}
 function close(){modal.classList.remove('open');(previousFocus||slot).focus()}
 slot.addEventListener('click',open);document.getElementById('cancel').addEventListener('click',close);
 modal.addEventListener('click',e=>{if(e.target===modal)close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))close()});
 confirm.addEventListener('click',()=>{
  if(confirm.textContent==='확인'){close();return;}
  const data=existing();
  question.textContent=!data?'불러올 저장 파일이 없습니다.':'게임 진행 상태 불러오기는 아직 연결되지 않았습니다.';
  confirm.textContent='확인';document.getElementById('cancel').style.display='none';
 });
 document.getElementById('backBtn').addEventListener('click',()=>{window.setTimeout(()=>{window.location.href='index.html'},110)});
 render();
})();
</script></body></html>
