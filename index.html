<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAME INTRO - 출근할까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:#747474;
    font-family:'Noto Sans KR', sans-serif;
    overflow-x:hidden;
    transition:background 0.5s;
  }
  body.finale {
    background:#747474;
  }
  /* 출근하기 누른 뒤에만 게임 배경 + 스토리 숨김 */
  body.goWork {
    background:#000 url('game_1.png') center / contain no-repeat fixed;
  }
  body.goWork #story { display:none; }

  /* ===== 스토리 영역 ===== */
  #story { transition:opacity .5s; }

  .stage {
    min-height:54vh;
    display:flex;
    align-items:center;
    padding:1.5vh 6vw;
  }
  /* 첫 화면: 정중앙 */
  .stage.intro { justify-content:center; padding:0; min-height:100vh; }
  .stage.intro img {
    width:min(60vw, 480px);
    height:auto;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));
  }

  .stage.left, .stage.right { justify-content:center; }
  .stage.left .toon-card { margin-right:min(10vw, 120px); }
  .stage.right .toon-card { margin-left:min(10vw, 120px); }

  .toon-card {
    width:min(72vw, 560px);
    opacity:0;
    transform:translateY(80px) scale(.96);
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
    will-change:opacity, transform;
  }
  .stage.left .toon-card { transform:translateX(-80px) translateY(40px); }
  .stage.right .toon-card { transform:translateX(80px) translateY(40px); }
  .toon-card.visible {
    opacity:1;
    transform:none;
  }
  .toon-card img {
    width:auto;
    height:auto;
    max-width:100%;
    max-height:76vh;
    display:block;
    border-radius:0;
    background:transparent;
    box-shadow:none;
  }
  .stage.right .toon-card img { margin-left:auto; }

  /* 로고도 스크롤 페이드 */
  .logo-wrap {
    opacity:0;
    transform:translateY(30px) scale(.97);
    transition:opacity .8s ease, transform .8s ease;
  }
  .logo-wrap.visible { opacity:1; transform:none; }

  .scroll-hint {
    position:fixed;
    bottom:22px; left:50%;
    transform:translateX(-50%);
    color:#fff; font-size:13px; font-weight:700;
    background:rgba(0,0,0,.45);
    padding:10px 18px; border-radius:999px;
    letter-spacing:.05em;
    animation:bounce 1.6s infinite;
    pointer-events:none;
    z-index:5;
    transition:opacity .4s;
  }
  body.finale .scroll-hint { display:none; }
  @keyframes bounce {
    0%,100% { transform:translate(-50%,0); }
    50% { transform:translate(-50%,10px); }
  }

  #final-gap { height:70vh; }
  #end-sentinel { height:30vh; display:flex; align-items:center; justify-content:center; color:#eee; font-weight:700; }

  /* ===== 피날레 / 팝업 (툰 배경 위에 오버레이) ===== */
  #finale {
    display:none;
  }
  body.finale #finale {
    display:flex;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:20;
  }

  .pixel-popup {
    font-family:'Press Start 2P', 'Noto Sans KR', monospace;
    background:#11131a;
    color:#fff;
    width:min(92vw, 460px);
    padding:0;
    border:4px solid #fff;
    outline:4px solid #000;
    box-shadow:
      0 0 0 4px #000,
      8px 8px 0 4px rgba(0,0,0,.55),
      0 20px 80px rgba(0,0,0,.6);
    image-rendering:pixelated;
    animation:pop .35s steps(4) both;
    text-align:center;
  }
  @keyframes pop {
    from { transform:scale(.8); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }
  .pixel-header {
    background:#222941;
    border-bottom:4px solid #fff;
    padding:12px;
    font-size:11px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .dots { display:flex; gap:6px; }
  .dots i { width:10px; height:10px; display:block; background:#ff5f56; box-shadow:inset -2px -2px 0 rgba(0,0,0,.4); }
  .dots i:nth-child(2){ background:#ffbd2e; } .dots i:nth-child(3){ background:#27c93f; }
  .pixel-body { padding:34px 26px 10px; }
  .pixel-body .q {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:clamp(26px,6vw,38px);
    line-height:1.3;
    text-shadow:3px 3px 0 #000, 6px 6px 0 rgba(0,0,0,.35);
    margin-bottom:14px;
  }
  .blink {
    font-size:10px;
    color:#ffe14d;
    animation:blink 1s steps(2) infinite;
    margin-bottom:8px;
    line-height:1.8;
  }
  @keyframes blink { 50% { opacity:0; } }
  .hp-bar {
    height:14px; border:3px solid #fff; background:#3a0d0d;
    margin:14px 4px 4px; position:relative;
  }
  .hp-bar span {
    display:block; height:100%; width:70%;
    background:repeating-linear-gradient(90deg,#39ff14 0 8px,#1fb30a 8px 12px);
  }
  .pixel-btns {
    display:flex; gap:12px;
    padding:22px 20px 24px;
    background:#11131a;
  }
  .px-btn {
    flex:1;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900; font-size:16px;
    padding:14px 0;
    cursor:pointer;
    border:0;
    color:#111;
    background:#f5f5f5;
    box-shadow:inset -4px -4px 0 rgba(0,0,0,.25), inset 4px 4px 0 #fff;
    outline:4px solid #000;
    transition:transform .08s steps(2);
  }
  .px-btn:active { transform:translate(2px,2px); }
  .px-btn.primary {
    background:#ffe14d;
    color:#111;
  }
  .px-btn:hover { filter:brightness(1.08); }
  .pixel-foot { font-size:9px; color:#8b93a7; padding-bottom:16px; line-height:1.8; }

  /* 출근 후 ch1 이미지 (game_1 배경 위, 전체화면) */
  #ch1-wrap {
    display:none;
    align-items:center;
    justify-content:center;
  }
  body.playing #finale { padding:0; }
  body.playing #ch1-wrap {
    display:flex;
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
  }
  #ch1-wrap img {
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    border-radius:0;
    animation:ch1in 1.5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes ch1in {
    from { opacity:0; transform:translateY(30px) scale(.94); }
    to { opacity:1; transform:none; }
  }

  /* 손님 등장 (s_1, 위에서 아래로) */
  #s1-wrap {
    display:none;
  }
  body.showS1 #s1-wrap {
    display:flex;
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    align-items:center;
    justify-content:center;
    z-index:5;
  }
  #s1-wrap img {
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    border-radius:0;
    animation:s1in .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes s1in {
    from { opacity:0; transform:translateY(-60px); }
    to { opacity:1; transform:none; }
  }
  /* 이미지 정리: 떠있는 ch_1·s_1 숨김 */
  body.playing.clearStage #ch1-wrap { display:none; }
  body.showS1.clearStage #s1-wrap { display:none; }
  /* 위에서 아래로 슬라이드하며 사라지기 */
  body.leaving #ch1-wrap img { animation:slideOutDown .2s ease both; }
  body.leaving #s1-wrap img { animation:slideOutDown .2s ease both; }
  body.leaving #dlg-wrap { animation:dlgOutDown .2s ease both; }
  @keyframes slideOutDown {
    to { opacity:0; transform:translateY(20px); }
  }
  @keyframes dlgOutDown {
    to { opacity:0; transform:translate(-50%, 20px); }
  }

  /* 픽셀 말풍선 (ch1_1 위 하단) */
  #dlg-wrap {
    display:none;
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    width:min(92vw, 720px);
    z-index:10;
  }
  body.playing #dlg-wrap { display:block; }
  #choices {
    display:none;
    flex-direction:column;
    align-items:flex-end;
    gap:12px;
    margin-bottom:12px;
    animation:dlgup2 .4s steps(5) both;
  }
  body.playing.showChoices #choices { display:flex; }
  @keyframes dlgup2 {
    from { opacity:0; transform:translateY(12px); }
    to { opacity:1; transform:none; }
  }
  .choice-btn {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:19px;
    min-width:220px;
    text-align:center;
    background:#fff;
    opacity:1;
    color:#111;
    border:0;
    border-radius:6px;
    outline:3px solid #000;
    box-shadow:inset -3px -3px 0 rgba(0,0,0,.2), 5px 5px 0 2px rgba(0,0,0,.5);
    padding:14px 26px;
    cursor:pointer;
  }
  .choice-btn:hover { background:#ffe14d; }
  #dialogue {
    background:#11131a;
    color:#fff;
    border:4px solid #fff;
    outline:4px solid #000;
    box-shadow:8px 8px 0 4px rgba(0,0,0,.55);
    image-rendering:pixelated;
    animation:dlgup 1.2s ease both;
  }
  body.playing #dialogue { display:block; }
  @keyframes dlgup {
    from { opacity:0; transform:translateY(20px); filter:blur(6px); }
    to { opacity:1; transform:none; filter:blur(0); }
  }
  #dialogue .dlg-name {
    display:inline-block;
    font-family:'Press Start 2P', 'Noto Sans KR', monospace;
    font-size:11px;
    background:#ffe14d;
    color:#111;
    padding:8px 12px;
    margin:12px 0 0 14px;
    outline:3px solid #000;
  }
  #dialogue .dlg-text {
    font-weight:700;
    font-size:clamp(15px, 2.4vw, 19px);
    line-height:1.7;
    padding:12px 18px 8px;
    min-height:64px;
    white-space:pre-line;
  }
  #dialogue .dlg-next {
    text-align:right;
    padding:0 16px 12px;
    color:#ffe14d;
    font-size:14px;
    animation:blink 1s steps(2) infinite;
  }
  #clickHint {
    display:none;
    font-family:'Press Start 2P', 'Noto Sans KR', monospace;
    font-size:12px;
    letter-spacing:.15em;
    margin-left:10px;
  }
  body.showClick #clickHint { display:inline; }
  body.playing.dlgDone #dlg-wrap { display:none; }

  @media (max-width:640px){
    .toon-card { width:86vw; }
    .stage { padding:1vh 7vw; min-height:48vh; }
    .pixel-btns { flex-direction:column; }
  }
</style>
</head>
<body>

<div class="scroll-hint" id="hint">▼ SCROLL ▼</div>

<!-- 스토리 -->
<main id="story">
  <section class="stage intro">
    <div class="logo-wrap" id="logoWrap">
      <img src="logo.png" alt="GAME LOGO" />
    </div>
  </section>

  <section class="stage left"><div class="toon-card"><img src="toon_1.png" alt="toon 1" onerror="this.src='https://placehold.co/560x700/333/fff?text=toon_1'"></div></section>
  <section class="stage right"><div class="toon-card"><img src="toon_2.png" alt="toon 2" onerror="this.src='https://placehold.co/560x700/444/fff?text=toon_2'"></div></section>
  <section class="stage left"><div class="toon-card"><img src="toon_3.png" alt="toon 3" onerror="this.src='https://placehold.co/560x700/333/fff?text=toon_3'"></div></section>
  <section class="stage right"><div class="toon-card"><img src="toon_4.png" alt="toon 4" onerror="this.src='https://placehold.co/560x700/444/fff?text=toon_4'"></div></section>
  <section class="stage left"><div class="toon-card"><img src="toon_5.png" alt="toon 5" onerror="this.src='https://placehold.co/560x700/333/fff?text=toon_5'"></div></section>
  <section class="stage right" id="lastToon"><div class="toon-card"><img src="toon_6.png" alt="toon 6" onerror="this.src='https://placehold.co/560x700/444/fff?text=toon_6'"></div></section>

  <div id="final-gap"></div>
  <div id="end-sentinel">스크롤을 올리면 다시 스토리를 볼 수 있습니다.</div>
</main>

<!-- 피날레 팝업 -->
<div id="finale" role="dialog" aria-modal="true" aria-label="출근 선택">
  <div class="pixel-popup">
    <div class="pixel-header"><div class="dots"><i></i><i></i><i></i></div><span>QUEST CLEAR!</span><span>♥ 3</span></div>
    <div class="pixel-body">
      <div class="blink">★ STORY COMPLETE ★<br>PRESS YOUR CHOICE</div>
      <div class="q">출근할까?</div>
      <div class="hp-bar"><span></span></div>
    </div>
    <div class="pixel-btns">
      <button class="px-btn" id="btnHome">◀ 처음으로</button>
      <button class="px-btn primary" id="btnGo">출근하기 ▶</button>
    </div>
    <div class="pixel-foot">TIP: 위로 스크롤하면 스토리가 다시 볼 수 있습니다</div>
  </div>
  <div id="ch1-wrap"><img src="ch1_1.png" alt="ch1_1"></div>
  <div id="s1-wrap"><img src="s_1.png" alt="s_1"></div>
  <div id="dlg-wrap">
    <div id="choices" role="group" aria-label="선택지">
      <button class="choice-btn" data-choice="yes">네</button>
      <button class="choice-btn" data-choice="no">싫은데요.</button>
    </div>
    <div id="dialogue" role="dialog" aria-label="대사">
      <div class="dlg-name">편의점 점장</div>
      <div class="dlg-text">오, 진짜 출근했네요!</div>
      <div class="dlg-next">▼<span id="clickHint">CLICK</span></div>
    </div>
  </div>
</div>

<script>
  // 1) 나타나기 (한번 나타나면 유지, 로고만 사라짐)
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.target.classList.contains('logo-wrap')) {
        if (e.isIntersecting) e.target.classList.add('visible');
        else e.target.classList.remove('visible');
      } else if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -5% 0px' });

  document.querySelectorAll('.toon-card, .logo-wrap').forEach(el => io.observe(el));

  // 2) 마지막까지 내리면 피날레 진입
  const sentinel = document.getElementById('end-sentinel');
  const lastToon = document.getElementById('lastToon');
  let lastToonSeen = false;
  let lastToonPassed = false;
  let isFinale = false;
  let gameStarted = false;

  // toon_6을 충분히 봤는지 + 지나쳤는지 (이미지 크기와 무관하게 동작)
  function checkLast(){
    const r = lastToon.getBoundingClientRect();
    if(r.top < window.innerHeight * 0.6) lastToonSeen = true;
    if(lastToonSeen && r.bottom < 0) lastToonPassed = true;
  }

  function enterFinale(){
    if(isFinale) return;
    isFinale = true;
    document.body.classList.add('finale');
  }
  function exitFinale(){
    if(!isFinale) return;
    if(gameStarted) return;
    isFinale = false;
    document.body.classList.remove('finale');
  }

  // sentinel이 보이면 진입 (toon_6을 충분히 보고 지나간 뒤에만)
  new IntersectionObserver((es)=>{
    es.forEach(e=>{
      if(e.isIntersecting && lastToonSeen && lastToonPassed) enterFinale();
    });
  },{threshold:0.5}).observe(sentinel);

  // 백업: 맨 밑까지 스크롤해도 진입
  window.addEventListener('scroll', ()=>{
    checkLast();
    if(!isFinale && lastToonSeen && lastToonPassed){
      const bottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 60;
      if(bottom) enterFinale();
    }
    document.getElementById('hint').style.opacity = window.scrollY > 80 ? '0' : '1';
  }, {passive:true});

  // 3) 팝업 상태에서 스크롤 올리면 사라짐 / 다시 내리면 등장
  window.addEventListener('wheel', (e)=>{
    if(gameStarted) return;
    if(isFinale && e.deltaY < -10) exitFinale();
  }, {passive:true});

  let touchY = null;
  window.addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchmove', e=>{
    if(gameStarted) return;
    if(!isFinale || touchY===null) return;
    const dy = e.touches[0].clientY - touchY;
    if(dy > 40) { exitFinale(); touchY = null; }
  }, {passive:true});

  // 피날레에서 다시 아래로 내리려는 시도가 있으면 유지 (팝업 유지),
  // 복귀 후 다시 밑으로 내리면 sentinel 감지로 재진입됨

  document.getElementById('btnHome').addEventListener('click', ()=>{
    exitFinale();
    setTimeout(()=>window.scrollTo({top:0, behavior:'smooth'}), 50);
  });
  // 편의점 자동문 띵동 (Web Audio 합성, 외부 파일 불필요)
  function playDoorJingle(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;

      // 1) 자동문 스윽 열림: 공기 빠지는 화이트노이즈 (짧게)
      const len = Math.floor(ctx.sampleRate * 0.3);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const noise = ctx.createBufferSource(); noise.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(500, t0);
      bp.frequency.linearRampToValueAtTime(2600, t0 + 0.22);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t0);
      ng.gain.exponentialRampToValueAtTime(0.05, t0 + 0.06);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      noise.connect(bp).connect(ng).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + 0.35);

      // 2) 띵동 벨: 기본음 + 종소리 특유의 비조화 부분음
      function bell(freq, start, dur, vol){
        const partials = [ [1, 1], [2.76, 0.25], [5.4, 0.1] ];
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        g.connect(ctx.destination);
        partials.forEach(([ratio, amp])=>{
          const o = ctx.createOscillator();
          o.type = 'sine'; o.frequency.value = freq * ratio;
          const og = ctx.createGain(); og.gain.value = amp;
          o.connect(og).connect(g);
          o.start(start); o.stop(start + dur + 0.05);
        });
      }
      bell(880, t0 + 0.08, 0.5, 0.28);      // 띵 (A5)
      bell(659.25, t0 + 0.32, 0.9, 0.28);    // 동 (E5, 길게 여운)
    }catch(e){ /* 오디오 실패 무시 */ }
    return 1250; // 효과음 전체 길이(ms)
  }

  document.getElementById('btnGo').addEventListener('click', ()=>{
    gameStarted = true;
    // 팝업 사라지게 + 게임 배경으로 교체 + 이전 화면으로 복귀 차단
    document.querySelector('.pixel-popup').style.display = 'none';
    document.body.classList.add('goWork');
    document.body.style.overflow = 'hidden';
    window.scrollTo(0,0);
    // 2초 뒤 효과음, 효과음이 끝나자마자 ch1_1 표시
    setTimeout(()=>{
      const dur = playDoorJingle() || 1250;
      setTimeout(()=>{
        document.body.classList.add('playing');
        resetIdle();
      }, dur);
    }, 2000);
  });

  // 비닐 내려놓는 소리 (Web Audio 합성, 짧게)
  function playPutDown(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      // 쿵 (낮은 타격음)
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t0);
      o.frequency.exponentialRampToValueAtTime(60, t0 + 0.18);
      og.gain.setValueAtTime(0.0001, t0);
      og.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015);
      og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.connect(og).connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.3);
      // 사락 (짧은 비닐 스침)
      const len = Math.floor(ctx.sampleRate * 0.3);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2500; bp.Q.value = 0.7;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t0 + 0.05);
      ng.gain.exponentialRampToValueAtTime(0.12, t0 + 0.12);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
      const src = ctx.createBufferSource(); src.buffer = buf;
      src.connect(bp).connect(ng).connect(ctx.destination);
      src.start(t0 + 0.05); src.stop(t0 + 0.45);
    }catch(e){ /* 오디오 실패 무시 */ }
  }

  // 자동문 스르륵 열림+닫힘 (Web Audio 합성)
  function playAutoDoor(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      function slide(start, sweepTo, dur){
        const len = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
        bp.frequency.setValueAtTime(400, start);
        bp.frequency.linearRampToValueAtTime(sweepTo, start + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.2, start + dur * 0.3);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        const src = ctx.createBufferSource(); src.buffer = buf;
        src.connect(bp).connect(g).connect(ctx.destination);
        src.start(start); src.stop(start + dur + 0.05);
      }
      slide(t0, 2200, 0.7);      // 열림
      slide(t0 + 0.9, 400, 0.7); // 닫힘
    }catch(e){ /* 오디오 실패 무시 */ }
  }

  // 손님이 물건 고르는 부드러운 바스락 소리 (Web Audio 합성)
  function playRustle(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return 0;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      const dur = 1.6;
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * 0.7;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      let t = t0;
      const end = t0 + dur;
      while(t < end){
        const peak = 0.04 + Math.random()*0.08;
        const bl = 0.08 + Math.random()*0.14;
        g.gain.exponentialRampToValueAtTime(peak, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, Math.min(t + bl, end));
        t += bl + Math.random()*0.12;
      }
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      src.connect(bp).connect(g).connect(ctx.destination);
      src.start(t0); src.stop(end + 0.05);
    }catch(e){ /* 오디오 실패 무시 */ }
    return 1600; // 효과음 전체 길이(ms)
  }

  // 계산대 삑 소리 (Web Audio 합성)
  function playBeep(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 2100;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
      o.connect(g).connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.25);
    }catch(e){ /* 오디오 실패 무시 */ }
  }

  // 10초 무조작 시 CLICK 힌트
  let idleTimer = null;
  function resetIdle(){
    document.body.classList.remove('showClick');
    clearTimeout(idleTimer);
    idleTimer = null;
    if(!document.body.classList.contains('playing')) return;
    if(document.body.classList.contains('dlgDone')) return;
    idleTimer = setTimeout(()=>document.body.classList.add('showClick'), 10000);
  }

  // 대사 넘기기
  const dialogues = [
    { name: '편의점 점장', text: '오, 진짜 출근했네요!' },
    { name: '편의점 점장', text: '그러면 오늘은 간단하게 손님 대응만 알려드릴게요' },
    { name: '편의점 점장', text: '일단 손님이 들어오시면 밝게 인사해주시고,\n손님이 물건을 고르실 때 까지 잠시 기다려주세요' },
    { name: '편의점 점장', text: '네?' },
    { name: '편의점 점장', text: '이제 스캐너를 물건에 대고 찍어보세요.' },
    { name: '편의점 점장', text: '이제 포스기에 뜨는 가격을 손님에게 알려주세요.' },
    { name: '편의점 점장', text: '네?' },
    { name: '편의점 점장', text: '잘했어요! 그러면 손님이 계산을 하시고 나가실거예요.' },
    { name: '편의점 점장', text: '이정도는 혼자 할 수 있겠죠?' },
    { name: '편의점 점장', text: '좋아요! 그럼 부탁드리겠습니다.' },
  ];
  let dlgIndex = 0;
  function showDialogue(i){
    document.body.classList.remove('dlgDone');
    document.querySelector('#dialogue .dlg-name').textContent = dialogues[i].name;
    document.querySelector('#dialogue .dlg-text').textContent = dialogues[i].text;
    // 네? 이후에는 선택지 둘 다 아닙니다.. 로 변경
    const btns = document.querySelectorAll('.choice-btn');
    if(i === 3){
      btns[0].textContent = '아닙니다..';
      btns[1].textContent = '아닙니다..';
      btns[1].style.display = '';
    } else if(i === 5){
      btns[0].textContent = '3000원';
      btns[1].textContent = '50000원';
      btns[1].style.display = '';
    } else if(i === 6){
      btns[0].textContent = '아, 3000원 입니다.';
      btns[1].style.display = 'none';
    } else if(i === 8){
      btns[0].textContent = '네!';
      btns[1].textContent = '음.. 아니요.';
      btns[1].style.display = '';
    } else {
      btns[0].textContent = '네';
      btns[1].textContent = '싫은데요.';
      btns[1].style.display = '';
    }
    // 두 번째·네?·가격·가격오답·혼자하기 대사에서 선택지 표시 (세 번째 설명 대사는 선택지 없음)
    document.body.classList.toggle('showChoices', i === 1 || i === 3 || i === 5 || i === 6 || i === 8);
    resetIdle();
  }
  function setChImage(src){
    const img = document.querySelector('#ch1-wrap img');
    const test = new Image();
    test.onload = ()=>{ img.src = src; };
    test.onerror = ()=>{ /* 파일 없으면 기존 이미지 유지 */ };
    test.src = src;
  }
  let s2keyed = null; // 테두리 제거된 s_2 캐시
  function setSImage(src){
    const img = document.querySelector('#s1-wrap img');
    if(!img) return;
    if(src === 's_2.png' && s2keyed){ img.src = s2keyed; return; }
    const test = new Image();
    test.onload = ()=>{
      if(src !== 's_2.png'){ img.src = src; return; }
      try{
        // s_2 외곽의 빨간 테두리만 투명 처리 (원본 색은 유지)
        const c = document.createElement('canvas');
        c.width = test.naturalWidth; c.height = test.naturalHeight;
        const cx = c.getContext('2d');
        cx.drawImage(test, 0, 0);
        const id = cx.getImageData(0, 0, c.width, c.height);
        const px = id.data;
        for(let i=0;i<px.length;i+=4){
          const r=px[i], gg=px[i+1], b=px[i+2];
          if(r>150 && gg>60 && b>60 && (r-gg)>40 && (r-b)>40) px[i+3]=0;
        }
        cx.putImageData(id, 0, 0);
        s2keyed = c.toDataURL('image/png');
        img.src = s2keyed;
      }catch(err){
        img.src = src; // file:// 보안 제한 등 실패 시 원본 표시
      }
    };
    test.onerror = ()=>{ /* 파일 없으면 기존 이미지 유지 */ };
    test.src = src;
  }
  const s1Img = document.querySelector('#s1-wrap img');
  if(s1Img){
    // 흰색 부분 진입 시 s_1 <-> s_2 전환 (투명 제외, 들어갈 때 1회만)
    let map1 = null, map2 = null;
    function loadMap(src, cb){
      const p = new Image();
      p.onload = ()=>{
        try{
          const c = document.createElement('canvas');
          c.width = p.naturalWidth; c.height = p.naturalHeight;
          const cx = c.getContext('2d');
          cx.drawImage(p, 0, 0);
          cb(cx.getImageData(0, 0, c.width, c.height));
        }catch(err){ cb(null); }
      };
      p.onerror = ()=>cb(null);
      p.src = src;
    }
    loadMap('s_1.png', (m)=>{ map1 = m; });
    loadMap('s_2.png', (m)=>{ map2 = m; });
    let showingS2 = false;
    let wasWhite = false;
    function isWhitePixel(map, e){
      if(!map) return null; // 판별 불가
      const r = s1Img.getBoundingClientRect();
      const iw = map.width, ih = map.height;
      const scale = Math.min(r.width / iw, r.height / ih);
      const rw = iw * scale, rh = ih * scale;
      const px = (e.clientX - r.left - (r.width - rw) / 2) / scale;
      const py = (e.clientY - r.top - (r.height - rh) / 2) / scale;
      if(px < 0 || py < 0 || px >= iw || py >= ih) return false;
      const o = (Math.floor(py) * iw + Math.floor(px)) * 4;
      if(map.data[o + 3] <= 20) return false; // 투명 제외
      return map.data[o] > 200 && map.data[o + 1] > 200 && map.data[o + 2] > 200;
    }
    s1Img.addEventListener('mousemove', (e)=>{
      const w = isWhitePixel(showingS2 ? map2 : map1, e);
      if(w === null){ // 픽셀 판별 불가 시 전체 hover로 동작
        if(!showingS2){ showingS2 = true; wasWhite = true; setSImage('s_2.png'); }
        return;
      }
      if(w && !wasWhite){
        showingS2 = !showingS2;
        setSImage(showingS2 ? 's_2.png' : 's_1.png');
      }
      wasWhite = w;
    });
    s1Img.addEventListener('mouseleave', ()=>{ showingS2 = false; wasWhite = false; setSImage('s_1.png'); });
    s1Img.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(!showingS2) return;   // s_2 표시 중에만
      if(dlgIndex !== 4) return;
      playBeep();
      setTimeout(()=>{
        dlgIndex = 5;
        showDialogue(dlgIndex);
      }, 500);
    });
  }
  document.addEventListener('click', (e)=>{
    if(!document.body.classList.contains('playing')) return;
    if(document.body.classList.contains('dlgDone')) return;
    resetIdle();
    if(e.target.closest('#choices')) return;
    if(document.body.classList.contains('showChoices')) return; // 선택지 표시 중 배경 클릭 무시
    if(dlgIndex === 2){
      // 세 번째 설명 대사 클릭: 대화창 완전히 사라지게 + 바스락 소리 후 손님 등장
      document.body.classList.add('dlgDone');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      const rDur = playRustle() || 1600;
      setTimeout(()=>{
        document.body.classList.add('showS1');
        setTimeout(()=>{ playPutDown(); }, 900); // s_1 등장 완료 후
        setTimeout(()=>{
          dlgIndex = 4;
          showDialogue(dlgIndex);
        }, 1000);
      }, rDur);
      return;
    }
    if(dlgIndex === 4){
      // 스캐너 대사 클릭: 대화창 사라지게 + s_1 자유 상태(여백·hover 테두리)
      document.body.classList.add('dlgDone', 's1free');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      return;
    }
    if(dlgIndex === 9){
      // 좋아요 대사 클릭: 위→아래 슬라이드로 정리 + 자동문 여닫힘 소리
      if(document.body.classList.contains('clearStage') || document.body.classList.contains('leaving')) return;
      document.body.classList.add('leaving');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      playAutoDoor();
      setTimeout(()=>{
        document.body.classList.add('clearStage', 'dlgDone');
        document.body.classList.remove('leaving');
        // 3초 대기 후 띵동 + ch2_1 등장
        setTimeout(()=>{
          playDoorJingle();
          const cImg = document.querySelector('#ch1-wrap img');
          const test = new Image();
          test.onload = ()=>{
            document.body.classList.remove('showS1', 'clearStage');
            cImg.src = 'ch2_1.png';
            cImg.style.animation = 'none';
            void cImg.offsetWidth;
            cImg.style.animation = '';
          };
          test.onerror = ()=>{ /* 파일 없으면 유지 */ };
          test.src = 'ch2_1.png';
        }, 3000);
      }, 200);
      return;
    }
    if(dlgIndex >= dialogues.length - 1) return;
    dlgIndex++;
    showDialogue(dlgIndex);
    if(dlgIndex === 3) setChImage('ch1_2.png');
  });
  document.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      document.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      if(btn.dataset.choice === 'yes'){
        if(dlgIndex === 1){ dlgIndex = 2; showDialogue(dlgIndex); }
        else if(dlgIndex === 3){ dlgIndex = 2; showDialogue(dlgIndex); setChImage('ch1_1.png'); }
        else if(dlgIndex === 5){ dlgIndex = 7; showDialogue(dlgIndex); }
        else if(dlgIndex === 6){ dlgIndex = 7; showDialogue(dlgIndex); }
        else if(dlgIndex === 8){ dlgIndex = 9; showDialogue(dlgIndex); }
      } else {
        if(dlgIndex === 1){ dlgIndex = 3; showDialogue(dlgIndex); setChImage('ch1_2.png'); }
        else if(dlgIndex === 3){ dlgIndex = 2; showDialogue(dlgIndex); setChImage('ch1_1.png'); }
        else if(dlgIndex === 5){ dlgIndex = 6; showDialogue(dlgIndex); }
        else if(dlgIndex === 8){ dlgIndex = 2; showDialogue(dlgIndex); setChImage('ch1_1.png'); }
      }
    });
  });
</script>
