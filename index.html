<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GAME INTRO - 출근할까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background:#747474;
    font-family:'Noto Sans KR', sans-serif;
    overflow-x:hidden;
    transition:background 0.5s;
  }
  body.finale {
    background:#747474;
  }
  /* 출근하기 누른 뒤에만 게임 배경 + 스토리 숨김 */
  body.goWork {
    background:#000 url('game_1.png') center / contain no-repeat fixed;
  }
  body.goWork #story { display:none; }
  /* 퇴근: game_4 배경 + 장식 오버레이 숨김 */
  body.goHome {
    background:#000 url('game_4.png') center / contain no-repeat fixed;
  }
  body.goWork.goHome #game2-wrap, body.goWork.goHome #game3-wrap { display:none; }
  /* s_9: game_4 이미지 중앙 (위치는 JS에서 보정) */
  #s9-wrap {
    display:none;
    position:fixed;
    left:0;
    top:0;
    z-index:6;
  }
  body.goHome #s9-wrap { display:block; }
  #s9-wrap img { display:block; }
  /* 휴대폰 메신저 화면 */
  #msgScreen {
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    background:rgba(0,0,0,.6);
    align-items:center;
    justify-content:center;
  }
  body.showMsg #msgScreen { display:flex; }
  .msg-phone {
    width:min(92vw, 400px);
    height:min(78vh, 620px);
    background:#efe9dc;
    border:4px solid #fff;
    outline:4px solid #000;
    display:flex;
    flex-direction:column;
    font-family:'Noto Sans KR', sans-serif;
  }
  .msg-head {
    background:#11131a;
    color:#fff;
    font-weight:900;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .msg-head button { background:none; border:0; color:#fff; font-size:18px; cursor:pointer; }
  .msg-thread { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg-row { max-width:80%; padding:9px 12px; border-radius:12px; font-size:15px; font-weight:700; line-height:1.5; }
  .msg-row.them { background:#fff; align-self:flex-start; border:2px solid #111; }
  .msg-row.me { background:#ffe14d; align-self:flex-end; border:2px solid #111; }
  .msg-thread a { color:#0066cc; font-weight:900; text-decoration:underline; }
  .msg-input { display:flex; gap:8px; padding:10px; background:#ddd5c2; }
  .msg-input input { flex:1; border:3px solid #111; padding:10px; font:inherit; font-size:14px; min-width:0; }
  .msg-input button { background:#11131a; color:#fff; border:0; font-weight:900; padding:0 16px; cursor:pointer; }
  .msg-input input:disabled { background:#c9c9c9; }
  .msg-input button:disabled { background:#777; cursor:default; }

  /* game_2 계산대 옆 바닥 (계산대와 겹치지 않게 왼쪽에 붙임) */
  #game2-wrap {
    display:none;
    position:fixed;
    right:14%;
    bottom:0;
    width:min(20vw, 320px);
    z-index:6;
  }
  body.goWork #game2-wrap { display:block; }
  #game2-wrap img { width:100%; height:auto; display:block; }
  /* game_3 좌상단 오버레이 (game_1 이미지 모서리 기준, 위치는 JS에서 보정) */
  #game3-wrap {
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:min(40vw, 680px);
    z-index:6;
  }
  body.goWork #game3-wrap { display:block; }
  #game3-wrap img { width:100%; height:auto; display:block; }
  #game3-wrap #game33img {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
  }
  #game2-wrap { transition:transform .25s ease; touch-action:none; user-select:none; -webkit-user-select:none; }
  #game2-wrap img { -webkit-user-drag:none; }
  body.canScan #game2-wrap { cursor:grab; }
  body.canScan #game2-wrap.dragging { cursor:grabbing; }

  /* ===== 스토리 영역 ===== */
  #story { transition:opacity .5s; }

  .stage {
    min-height:54vh;
    display:flex;
    align-items:center;
    padding:1.5vh 6vw;
  }
  /* 첫 화면: 정중앙 */
  .stage.intro { justify-content:center; padding:0; min-height:100vh; }
  .stage.intro img {
    width:min(78vw, 620px);
    height:auto;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.45));
  }

  .stage.left, .stage.right { justify-content:center; }
  .stage.left .toon-card { margin-right:min(10vw, 120px); }
  .stage.right .toon-card { margin-left:min(10vw, 120px); }

  .toon-card {
    width:min(72vw, 560px);
    opacity:0;
    transform:translateY(80px) scale(.96);
    transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
    will-change:opacity, transform;
  }
  .stage.left .toon-card { transform:translateX(-80px) translateY(40px); }
  .stage.right .toon-card { transform:translateX(80px) translateY(40px); }
  .toon-card.visible {
    opacity:1;
    transform:none;
  }
  .toon-card img {
    width:auto;
    height:auto;
    max-width:100%;
    max-height:76vh;
    display:block;
    border-radius:0;
    background:transparent;
    box-shadow:none;
  }
  .stage.right .toon-card img { margin-left:auto; }

  /* toon_6: 전체화면 중앙 */
  #lastToon {
    min-height:100vh;
    justify-content:center;
    padding:0;
  }
  #lastToon .toon-card { width:100%; margin:0; position:relative; z-index:1; }
  #lastToon .toon-card img {
    width:100%;
    height:100vh;
    max-width:none;
    max-height:none;
    margin:0;
    object-fit:contain;
    transform:translateX(-6%);
  }

  /* 로고도 스크롤 페이드 */
  .logo-wrap {
    opacity:0;
    transform:translateY(30px) scale(.97);
    transition:opacity .8s ease, transform .8s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    text-align:center;
    padding:0 20px;
  }
  .logo-wrap.visible { opacity:1; transform:none; }
  .logo-caption {
    display:flex;
    flex-direction:column;
    gap:10px;
    color:#fff;
    line-height:1.7;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }
  .logo-caption .lc-title {
    font-weight:900;
    font-size:clamp(22px, 4.5vw, 32px);
    letter-spacing:.06em;
  }
  .logo-caption span:not(.lc-title) {
    font-weight:300;
    font-size:clamp(14px, 2.6vw, 18px);
  }

  .scroll-hint {
    position:fixed;
    bottom:22px; left:50%;
    transform:translateX(-50%);
    color:#fff; font-size:13px; font-weight:700;
    background:rgba(0,0,0,.45);
    padding:10px 18px; border-radius:999px;
    letter-spacing:.05em;
    animation:bounce 1.6s infinite;
    pointer-events:none;
    z-index:5;
    transition:opacity .4s;
  }
  body.finale .scroll-hint { display:none; }

  /* 햄버거 메뉴 (첫 화면 좌상단) */
  #menuBtn {
    position:fixed;
    top:18px;
    left:18px;
    width:46px;
    height:42px;
    background:transparent;
    border:0;
    cursor:pointer;
    z-index:60;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  #menuBtn span {
    display:block;
    width:22px;
    height:3px;
    background:#fff;
  }
  body.goWork #menuBtn { display:none; }
  body.menuUnder #menuBtn, body.menuUnder #menuPanel { z-index:0; }
  #menuPanel {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:min(78vw, 260px);
    height:100vh;
    background:#11131a;
    color:#fff;
    border-right:4px solid #fff;
    z-index:59;
    padding:76px 18px 18px;
    overflow-y:auto;
  }
  body.menuOpen #menuPanel { display:block; }
  body.goWork #menuPanel { display:none !important; }
  #menuPanel button {
    display:block;
    width:100%;
    text-align:left;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:16px;
    color:#fff;
    background:transparent;
    border:0;
    border-bottom:2px solid #333;
    padding:13px 8px;
    cursor:pointer;
  }
  #menuPanel button:hover { background:#ffe14d; color:#111; }
  #menuClose {
    position:absolute;
    top:18px;
    right:14px;
    width:auto !important;
    border:0 !important;
    font-size:20px !important;
    padding:4px 8px !important;
  }
  @keyframes bounce {
    0%,100% { transform:translate(-50%,0); }
    50% { transform:translate(-50%,10px); }
  }

  /* ===== 피날레 / 팝업 (툰 배경 위에 오버레이) ===== */
  #finale {
    display:none;
  }
  body.finale #finale {
    display:flex;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:20;
  }

  /* 피날레: 게임 대화창 */
  body.finale #dlg-wrap { display:block; }

  .pixel-popup {
    font-family:'Press Start 2P', 'Noto Sans KR', monospace;
    background:#11131a;
    color:#fff;
    width:min(92vw, 460px);
    padding:0;
    border:4px solid #fff;
    outline:4px solid #000;
    box-shadow:
      0 0 0 4px #000,
      8px 8px 0 4px rgba(0,0,0,.55),
      0 20px 80px rgba(0,0,0,.6);
    image-rendering:pixelated;
    animation:pop .35s steps(4) both;
    text-align:center;
  }
  @keyframes pop {
    from { transform:scale(.8); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }
  .pixel-header {
    background:#222941;
    border-bottom:4px solid #fff;
    padding:12px;
    font-size:11px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .dots { display:flex; gap:6px; }
  .dots i { width:10px; height:10px; display:block; background:#ff5f56; box-shadow:inset -2px -2px 0 rgba(0,0,0,.4); }
  .dots i:nth-child(2){ background:#ffbd2e; } .dots i:nth-child(3){ background:#27c93f; }
  .pixel-body { padding:34px 26px 10px; }
  .pixel-body .q {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:clamp(26px,6vw,38px);
    line-height:1.3;
    text-shadow:3px 3px 0 #000, 6px 6px 0 rgba(0,0,0,.35);
    margin-bottom:14px;
  }
  .blink {
    font-size:10px;
    color:#ffe14d;
    animation:blink 1s steps(2) infinite;
    margin-bottom:8px;
    line-height:1.8;
  }
  @keyframes blink { 50% { opacity:0; } }
  .hp-bar {
    height:14px; border:3px solid #fff; background:#3a0d0d;
    margin:14px 4px 4px; position:relative;
  }
  .hp-bar span {
    display:block; height:100%; width:70%;
    background:repeating-linear-gradient(90deg,#39ff14 0 8px,#1fb30a 8px 12px);
  }
  .pixel-btns {
    display:flex; gap:12px;
    padding:22px 20px 24px;
    background:#11131a;
  }
  .px-btn {
    flex:1;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900; font-size:16px;
    padding:14px 0;
    cursor:pointer;
    border:0;
    color:#111;
    background:#f5f5f5;
    box-shadow:inset -4px -4px 0 rgba(0,0,0,.25), inset 4px 4px 0 #fff;
    outline:4px solid #000;
    transition:transform .08s steps(2);
  }
  .px-btn:active { transform:translate(2px,2px); }
  .px-btn.primary {
    background:#ffe14d;
    color:#111;
  }
  .px-btn:hover { filter:brightness(1.08); }
  .pixel-foot { font-size:9px; color:#8b93a7; padding-bottom:16px; line-height:1.8; }

  /* 출근 후 ch1 이미지 (game_1 배경 위, 전체화면) */
  #ch1-wrap {
    display:none;
    align-items:center;
    justify-content:center;
  }
  body.playing #finale { padding:0; }
  body.playing #ch1-wrap {
    display:flex;
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
  }
  #ch1-wrap img {
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    border-radius:0;
    animation:ch1in 1.5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes ch1in {
    from { opacity:0; transform:translateY(30px) scale(.94); }
    to { opacity:1; transform:none; }
  }

  /* 손님 등장 (s_1, 위에서 아래로) */
  #s1-wrap {
    display:none;
  }
  body.showS1 #s1-wrap {
    display:flex;
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    align-items:center;
    justify-content:center;
    z-index:5;
  }
  #s1-wrap img {
    width:100vw;
    height:100vh;
    object-fit:contain;
    display:block;
    border-radius:0;
    animation:s1in .9s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes s1in {
    from { opacity:0; transform:translateY(-60px); }
    to { opacity:1; transform:none; }
  }
  /* s_5: 작게 + 화면 중앙 하단 */
  body.showS1.s5mini #s1-wrap { align-items:flex-end; justify-content:center; }
  body.showS1.s5mini #s1-wrap img {
    width:min(22vw, 330px);
    height:auto;
    position:relative;
    left:-2vw;
  }
  /* s_1: s_5보다 크게 + 살짝 위 */
  body.showS1.s1mini #s1-wrap { align-items:flex-end; justify-content:center; }
  body.showS1.s1mini #s1-wrap img {
    width:min(26vw, 400px);
    height:auto;
    position:relative;
    left:-2vw;
    margin-bottom:4vh;
  }
  /* 이미지 정리: 떠있는 ch_1·s_1 숨김 */
  body.playing.clearStage #ch1-wrap { display:none; }
  body.showS1.clearStage #s1-wrap { display:none; }
  body.hideCh #ch1-wrap { display:none; }
  /* 위에서 아래로 슬라이드하며 사라지기 */
  body.leaving #ch1-wrap img { animation:slideOutDown .2s ease both; }
  body.leaving #s1-wrap img { animation:slideOutDown .2s ease both; }
  body.leaving #dlg-wrap { animation:dlgOutDown .2s ease both; }
  @keyframes slideOutDown {
    to { opacity:0; transform:translateY(20px); }
  }
  @keyframes dlgOutDown {
    to { opacity:0; transform:translate(-50%, 20px); }
  }
  @keyframes slideOutUp {
    to { opacity:0; transform:translateY(-20px); }
  }
  /* ch4_1 등장 시 화면 점점 어둡게 (대화창보다 아래) */
  #darken {
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    opacity:0;
    z-index:8;
    pointer-events:none;
  }
  body.darkch4 #darken { display:block; animation:darkenIn 9s ease both; }
  @keyframes darkenIn {
    from { opacity:0; }
    to { opacity:.55; }
  }
  /* ch4_2 교체 후 화면 전체 점진 확대 */
  body.zoomch4 #ch1-wrap img { animation:ch4zoom 8s ease both; }
  @keyframes ch4zoom {
    from { transform:scale(1); }
    to { transform:scale(1.18); }
  }

  /* 픽셀 말풍선 (ch1_1 위 하단) */
  #dlg-wrap {
    display:none;
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%);
    width:min(92vw, 720px);
    z-index:10;
  }
  body.playing #dlg-wrap { display:block; }
  body.goWork:not(.playing) #dlg-wrap { display:none; }
  #choices {
    display:none;
    flex-direction:column;
    align-items:flex-end;
    gap:12px;
    margin-bottom:12px;
    opacity:1;
  }
  body.playing.showChoices #choices { display:flex; }
  .choice-btn {
    font-family:'Noto Sans KR', sans-serif;
    font-weight:900;
    font-size:19px;
    min-width:220px;
    text-align:center;
    background:#fff;
    opacity:1;
    color:#111;
    border:0;
    border-radius:6px;
    outline:3px solid #000;
    box-shadow:5px 5px 0 2px #000;
    padding:14px 26px;
    cursor:pointer;
  }
  .choice-btn:hover { background:#ffe14d; }
  #dialogue {
    background:#11131a;
    color:#fff;
    border:4px solid #fff;
    outline:4px solid #000;
    box-shadow:8px 8px 0 4px rgba(0,0,0,.55);
    image-rendering:pixelated;
    animation:dlgup 1.2s ease both;
  }
  body.playing #dialogue { display:block; }
  @keyframes dlgup {
    from { opacity:0; transform:translateY(20px); filter:blur(6px); }
    to { opacity:1; transform:none; filter:blur(0); }
  }
  #dialogue .dlg-name {
    display:inline-block;
    font-family:'Press Start 2P', 'Noto Sans KR', monospace;
    font-size:11px;
    background:#ffe14d;
    color:#111;
    padding:8px 12px;
    margin:12px 0 0 14px;
    outline:3px solid #000;
  }
  #dialogue .dlg-text {
    font-weight:700;
    font-size:clamp(15px, 2.4vw, 19px);
    line-height:1.7;
    padding:12px 18px 8px;
    min-height:64px;
    white-space:pre-line;
  }
  #dialogue .dlg-next {
    text-align:right;
    padding:0 16px 12px;
    color:#ffe14d;
    font-size:14px;
    animation:blink 1s steps(2) infinite;
  }
  #clickHint {
    display:none;
    font-family:'Press Start 2P', 'Noto Sans KR', monospace;
    font-size:12px;
    letter-spacing:.15em;
    margin-left:10px;
  }
  body.showClick #clickHint { display:inline; }
  body.playing.dlgDone #dlg-wrap { display:none; }

  @media (max-width:640px){
    .toon-card { width:86vw; }
    .stage { padding:1vh 7vw; min-height:48vh; }
    .pixel-btns { flex-direction:column; }
  }
</style>
</head>
<body>

<div class="scroll-hint" id="hint">▼ SCROLL ▼</div>

<button id="menuBtn" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
<nav id="menuPanel" aria-label="메뉴">
  <button id="menuClose" aria-label="메뉴 닫기">✕</button>
  <button data-go="ch1">점장님</button>
  <button data-go="ch2">일반 손님</button>
  <button data-go="ch3">진상 손님</button>
  <button data-go="ch4">?</button>
  <button data-go="quit1">퇴사 고민</button>
  <button data-go="quit2">퇴사!</button>
  <button data-go="quitdecide">퇴사 결정</button>
</nav>

<!-- 스토리 -->
<main id="story">
  <section class="stage intro">
    <div class="logo-wrap" id="logoWrap">
      <img src="logo.png" alt="GAME LOGO" />
      <p class="logo-caption">
        <span class="lc-title">鬼市巫談 : 귀시무담</span>
        <span>鬼市(귀시) : 악귀가 거래되거나 악귀 물품이 오가는 시장.</span>
        <span>巫談(무담) : 무당(巫)이 하는 이야기나 말(談). 신비로운 이야기나 주술적 대화.</span>
      </p>
    </div>
  </section>

  <section class="stage left"><div class="toon-card"><img src="toon_1.png" alt="toon 1" onerror="this.src='https://placehold.co/560x700/333/fff?text=toon_1'"></div></section>
  <section class="stage right" id="toon2"><div class="toon-card"><img src="toon_2.png" alt="toon 2" onerror="this.src='https://placehold.co/560x700/444/fff?text=toon_2'"></div></section>
  <section class="stage left"><div class="toon-card"><img src="toon_3.png" alt="toon 3" onerror="this.src='https://placehold.co/560x700/333/fff?text=toon_3'"></div></section>
  <section class="stage right"><div class="toon-card"><img src="toon_4.png" alt="toon 4" onerror="this.src='https://placehold.co/560x700/444/fff?text=toon_4'"></div></section>
  <section class="stage left"><div class="toon-card"><img src="toon_5.png" alt="toon 5" onerror="this.src='https://placehold.co/560x700/333/fff?text=toon_5'"></div></section>
  <section class="stage right" id="lastToon"><div class="toon-card"><img src="toon_6.png" alt="toon 6" onerror="this.src='https://placehold.co/560x700/444/fff?text=toon_6'"></div></section>
</main>

<!-- 피날레: 게임 대화창 -->
<div id="finale" role="dialog" aria-modal="true" aria-label="출근">
  <div id="ch1-wrap"><img src="ch1_1.png" alt="ch1_1"></div>
  <div id="s1-wrap"><img src="s_1.png" alt="s_1"></div>
  <div id="game2-wrap"><img src="game_2.png" alt="game 2" onerror="this.parentNode.style.display='none'"></div>
  <div id="s9-wrap"><img src="s_9.png" alt="s 9" onerror="this.parentNode.style.display='none'"></div>
  <div id="msgScreen" role="dialog" aria-label="메신저">
    <div class="msg-phone">
      <div class="msg-head"><span>편의점 점장</span><button id="msgClose" aria-label="닫기">✕</button></div>
      <div class="msg-thread" id="msgThread"></div>
      <div class="msg-input"><input id="msgInput" type="text" placeholder="메시지 입력... (퇴사한다고 말하자)" maxlength="200"><button id="msgSend">전송</button></div>
    </div>
  </div>
  <div id="game3-wrap"><img src="game_3.png" alt="game 3" onerror="this.parentNode.style.display='none'"><img id="game33img" src="game_3_3.png" alt="game 3-3" onerror="this.style.display='none'"></div>
  <div id="darken"></div>
  <div id="dlg-wrap">
    <div id="choices" role="group" aria-label="선택지">
      <button class="choice-btn" data-choice="yes">네</button>
      <button class="choice-btn" data-choice="no">싫은데요.</button>
    </div>
    <div id="dialogue" role="dialog" aria-label="대사">
      <div class="dlg-name">-</div>
      <div class="dlg-text">출근할까?</div>
      <div class="dlg-next">▼<span id="clickHint">CLICK</span></div>
    </div>
  </div>
</div>

<script>
  // 문자 메시지 알림음 (Web Audio 합성, 외부 파일 불필요)
  // 참고: 데스크탑 브라우저는 클릭/키입력 같은 사용자 조작이 1회 있기 전에는
  // 어떤 방법으로도 소리를 재생할 수 없는 자동재생 정책이 있습니다 (휠 스크롤은 조작으로 인정 안 됨).
  let msgCtx = null;
  let toon2Notified = false;
  let toon2Missed = false;
  let toon2Scheduled = false;
  // 크롬(Chromium 기반 Edge/Opera/Whale/삼성인터넷 제외)에서는 알림음을 재생하지 않음
  const isChromeBrowser = /Chrome|Chromium/.test(navigator.userAgent || '') && !/Edg|OPR|SamsungBrowser|Whale/.test(navigator.userAgent || '');
  function ensureMsgCtx(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!msgCtx) msgCtx = new AC();
      if(msgCtx.state === 'suspended') msgCtx.resume();
      return msgCtx;
    }catch(e){ return null; }
  }
  function beepNow(ctx){
    const t0 = ctx.currentTime + 0.02;
    function note(freq, start, dur, vol){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(vol, start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g).connect(ctx.destination);
      o.start(start); o.stop(start + dur + 0.05);
    }
    note(880, t0, 0.18, 0.25);          // 띵
    note(1174.66, t0 + 0.16, 0.4, 0.25); // 동 (약간 길게)
  }
  function playMessageSound(){
    try{
      const ctx = ensureMsgCtx();
      if(!ctx) return false;
      if(ctx.state !== 'running'){
        // resume()은 비동기라서, 해제되는 대로 그때 재생되게 예약
        ctx.resume().then(()=>{
          if(ctx.state === 'running' && !toon2Notified){
            try{ beepNow(ctx); }catch(e){}
            toon2Notified = true; toon2Missed = false;
          }
        }).catch(()=>{});
        return false;
      }
      beepNow(ctx);
      return true;
    }catch(e){ return false; }
  }
  function fireToon2Sound(){
    if(isChromeBrowser) return;
    if(toon2Notified) return;
    if(playMessageSound()){ toon2Notified = true; toon2Missed = false; }
    else toon2Missed = true;
  }
  function retryToon2Sound(){
    if(toon2Notified || !toon2Missed) return;
    fireToon2Sound();
  }
  // 미리 오디오 잠금 해제 + 막혔던 알림음 재시도 (스크롤 제스처 종료 시점에 바로 재생, 별도 탭 불필요)
  window.addEventListener('pointerdown', ensureMsgCtx);
  window.addEventListener('touchstart', ensureMsgCtx, {passive:true});
  window.addEventListener('keydown', ensureMsgCtx);
  window.addEventListener('click', ensureMsgCtx);
  window.addEventListener('pointerup', retryToon2Sound);
  window.addEventListener('touchend', retryToon2Sound);
  window.addEventListener('click', retryToon2Sound);
  window.addEventListener('keydown', retryToon2Sound);

  // 1) 나타나기 (한번 나타나면 유지, 로고만 사라짐)
  const toon2Card = document.querySelector('#toon2 .toon-card');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.target.classList.contains('logo-wrap')) {
        if (e.isIntersecting) e.target.classList.add('visible');
        else e.target.classList.remove('visible');
      } else if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -5% 0px' });

  // toon_2가 보이기 시작하면(선명해지기 시작하는 시점) 즉시 알림음. 크롬에서는 재생 안 함
  function onToon2Start(){
    if(isChromeBrowser) return;
    if(toon2Scheduled || toon2Notified) return;
    toon2Scheduled = true;
    fireToon2Sound();
  }
  if(toon2Card && 'IntersectionObserver' in window && !isChromeBrowser){
    const toon2IO = new IntersectionObserver((es)=>{
      es.forEach(en=>{
        if(en.isIntersecting){
          onToon2Start();
          toon2IO.unobserve(toon2Card);
        }
      });
    }, { threshold: 0.15 });
    toon2IO.observe(toon2Card);
  }

  document.querySelectorAll('.toon-card, .logo-wrap').forEach(el => io.observe(el));

  // 2) 마지막까지 내리면 피날레 진입
  const lastToon = document.getElementById('lastToon');
  let lastToonSeen = false;
  let lastToonPassed = false;
  let isFinale = false;
  let gameStarted = false;

  // toon_6 하단 위치 기반: 화면 하단에 닿으면 대화창 표시, 위로 벗어나면 숨김
  function checkLast(){
    const r = lastToon.getBoundingClientRect();
    if(r.top < window.innerHeight * 0.6) lastToonSeen = true;
    if(r.bottom > window.innerHeight + 40){
      lastToonPassed = false;
      if(isFinale) exitFinale();
    } else if(lastToonSeen && r.bottom <= window.innerHeight + 4){
      lastToonPassed = true;
    }
    if(!isFinale && lastToonSeen && lastToonPassed) enterFinale();
  }

  function enterFinale(){
    if(isFinale) return;
    isFinale = true;
    document.body.classList.add('finale');
  }
  function exitFinale(){
    if(!isFinale) return;
    if(gameStarted) return;
    isFinale = false;
    document.body.classList.remove('finale');
  }

  // 스크롤을 내릴수록 배경이 검정으로 (첫 화면 #747474 → 밑으로 갈수록 검정)
  function paintBack(){
    if(document.body.classList.contains('goWork')) return; // 게임 중에는 순수 검정 유지
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    const q = p < 0.25 ? 0 : (p - 0.25) / 0.75; // 초반 25% 구간은 #747474 유지
    const v = Math.max(34, Math.round(0x74 * (1 - q))); // 완전 검정이 아닌 밝은 검정(#222)에서 멈춤
    document.body.style.backgroundColor = 'rgb(' + v + ',' + v + ',' + v + ')';
  }
  // 게임 진입 시 스크롤 잔상(인라인 배경색) 제거 → 게임 배경은 순수 검정
  new MutationObserver(()=>{
    if(document.body.classList.contains('goWork')) document.body.style.backgroundColor = '';
    else paintBack();
  }).observe(document.body, { attributes:true, attributeFilter:['class'] });
  // 로드/리사이즈 직후에도 상태 갱신
  window.addEventListener('load', ()=>{ checkLast(); paintBack(); });
  window.addEventListener('resize', ()=>{ checkLast(); paintBack(); });

  // 백업: 맨 밑까지 스크롤해도 진입
  window.addEventListener('scroll', ()=>{
    checkLast();
    paintBack();
    const lr = lastToon.getBoundingClientRect();
    document.body.classList.toggle('menuUnder', lr.top < window.innerHeight * 0.8 && lr.bottom > window.innerHeight * 0.2);
    if(!isFinale && lastToonSeen && lastToonPassed){
      const bottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 60;
      if(bottom) enterFinale();
    }
    document.getElementById('hint').style.opacity = window.scrollY > 80 ? '0' : '1';
  }, {passive:true});

  // 3) 팝업 상태에서 스크롤 올리면 사라짐 / 다시 내리면 등장
  window.addEventListener('wheel', (e)=>{
    if(gameStarted) return;
    if(isFinale && e.deltaY < -10) exitFinale();
  }, {passive:true});

  let touchY = null;
  window.addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; }, {passive:true});
  window.addEventListener('touchmove', e=>{
    if(gameStarted) return;
    if(!isFinale || touchY===null) return;
    const dy = e.touches[0].clientY - touchY;
    if(dy > 40) { exitFinale(); touchY = null; }
  }, {passive:true});

  // 피날레에서 다시 아래로 내리려는 시도가 있으면 유지,
  // 복귀 후 다시 밑으로 내리면 위치 감지로 재진입됨

  // 종소리 딸랑 (Web Audio 합성)
  function playBell(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return 0;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      function bell(freq, start, dur, vol){
        const partials = [ [1, 1], [2.01, 0.3] ];
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        g.connect(ctx.destination);
        partials.forEach(([ratio, amp])=>{
          const o = ctx.createOscillator();
          o.type = 'sine'; o.frequency.value = freq * ratio;
          const og = ctx.createGain(); og.gain.value = amp;
          o.connect(og).connect(g);
          o.start(start); o.stop(start + dur + 0.05);
        });
      }
      bell(1568, t0, 0.4, 0.25);        // 딸
      bell(2093, t0 + 0.18, 0.6, 0.22); // 랑
    }catch(e){ /* 오디오 실패 무시 */ }
    return 900; // 효과음 전체 길이(ms)
  }

  // 편의점 자동문 띵동 (Web Audio 합성, 외부 파일 불필요)
  function playDoorJingle(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;

      // 1) 자동문 스윽 열림: 공기 빠지는 화이트노이즈 (짧게)
      const len = Math.floor(ctx.sampleRate * 0.3);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const noise = ctx.createBufferSource(); noise.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(500, t0);
      bp.frequency.linearRampToValueAtTime(2600, t0 + 0.22);
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t0);
      ng.gain.exponentialRampToValueAtTime(0.05, t0 + 0.06);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      noise.connect(bp).connect(ng).connect(ctx.destination);
      noise.start(t0); noise.stop(t0 + 0.35);

      // 2) 띵동 벨: 기본음 + 종소리 특유의 비조화 부분음
      function bell(freq, start, dur, vol){
        const partials = [ [1, 1], [2.76, 0.25], [5.4, 0.1] ];
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(vol, start + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        g.connect(ctx.destination);
        partials.forEach(([ratio, amp])=>{
          const o = ctx.createOscillator();
          o.type = 'sine'; o.frequency.value = freq * ratio;
          const og = ctx.createGain(); og.gain.value = amp;
          o.connect(og).connect(g);
          o.start(start); o.stop(start + dur + 0.05);
        });
      }
      bell(880, t0 + 0.08, 0.5, 0.28);      // 띵 (A5)
      bell(659.25, t0 + 0.32, 0.9, 0.28);    // 동 (E5, 길게 여운)
    }catch(e){ /* 오디오 실패 무시 */ }
    return 1250; // 효과음 전체 길이(ms)
  }

  // toon_6 / 대화창 클릭 → 게임 시작 (기존 출근하기 역할)
  function startGame(){
    if(gameStarted) return;
    gameStarted = true;
    document.body.classList.add('finale', 'goWork');
    document.body.style.overflow = 'hidden';
    window.scrollTo(0,0);
    // 클릭 즉시 종소리 딸랑 + 화면전환, 잠시 텀을 둔 뒤 자동문 열림과 함께 ch1_1 + 첫 대사 표시
    const bDur = playBell() || 900;
    setTimeout(()=>{
      playDoorOpen();
      dlgIndex = 0;
      showDialogue(dlgIndex);
      document.body.classList.add('playing');
      resetIdle();
    }, bDur + 1000);
  }
  document.querySelector('#lastToon .toon-card').addEventListener('click', startGame);
  document.querySelector('#dialogue').addEventListener('click', ()=>{
    if(gameStarted || document.body.classList.contains('playing')) return;
    if(!document.body.classList.contains('finale')) return;
    startGame();
  });
  // ch4_1 이미지 클릭 → ch4_2로 즉시 변경 + 화면 확대
  document.querySelector('#ch1-wrap img').addEventListener('click', (e)=>{
    e.stopPropagation();
    const cImg = document.querySelector('#ch1-wrap img');
    const cur = cImg.getAttribute('src') || '';
    if(cur.indexOf('ch4_1.png') === -1) return;
    const test = new Image();
    test.onload = ()=>{
      cImg.src = 'ch4_2.png';
      document.body.classList.add('zoomch4');
    };
    test.src = 'ch4_2.png';
  });

  // 햄버거 메뉴
  document.querySelector('#menuBtn').addEventListener('click', ()=>{
    document.body.classList.toggle('menuOpen');
  });
  document.querySelector('#menuClose').addEventListener('click', ()=>{
    document.body.classList.remove('menuOpen');
  });
  document.querySelectorAll('#menuPanel [data-go]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const go = btn.dataset.go;
      document.body.classList.remove('menuOpen');
      if(go === 'ch1'){ startGame(); return; }
      if(go === 'ch2'){ goChapter('ch2_1.png', 10); return; }
      if(go === 'quit1'){
        // 퇴사 고민: game_3 기본값이 되었을 때 나오는 부분 (하... 대사)
        if(!gameStarted) gameStarted = true;
        document.body.classList.add('finale', 'goWork');
        document.body.style.overflow = 'hidden';
        window.scrollTo(0,0);
        revertToBG();
        const g33q = document.querySelector('#game33img');
        if(g33q) g33q.src = 'game_3.png';
        dlgIndex = 25;
        showDialogue(dlgIndex);
        document.body.classList.add('playing');
        resetIdle();
        return;
      }
      if(go === 'quit2'){
        // 퇴사!: (-) 핸드폰이 울린다 파트로 (1초 뒤 진동 + 대사)
        if(!gameStarted) gameStarted = true;
        stopHorrorBG();
        quitWait = true;
        document.body.classList.add('finale', 'goWork', 'goHome', 'dlgDone', 'clearStage');
        document.body.classList.remove('showS1', 'showClick', 'showChoices', 'darkch4', 'zoomch4');
        document.body.style.overflow = 'hidden';
        window.scrollTo(0,0);
        clearTimeout(idleTimer);
        layoutS9();
        setTimeout(()=>{
          quitWait = false;
          playVibe();
          dlgIndex = 35;
          showDialogue(dlgIndex);
          document.body.classList.add('playing');
          resetIdle();
        }, 1000);
        return;
      }
      if(go === 'quitdecide'){
        // 퇴사 결정: 일단 퇴근하기 경로 (game_4 + s_9 + 퇴사한다고 문자로 말하자)
        if(!gameStarted) gameStarted = true;
        document.body.classList.add('finale', 'goWork');
        document.body.style.overflow = 'hidden';
        window.scrollTo(0,0);
        enterQuitHome(34);
        document.body.classList.add('playing');
        resetIdle();
        return;
      }
      if(go === 'ch3'){
        // 진상 손님: 띵동 + 어서오세요 부분으로 (이미지 없이)
        if(!gameStarted) gameStarted = true;
        document.body.classList.add('finale', 'goWork');
        document.body.style.overflow = 'hidden';
        window.scrollTo(0,0);
        document.body.classList.add('clearStage');
        playDoorJingle();
        dlgIndex = 13;
        showDialogue(dlgIndex);
        document.body.classList.add('playing');
        resetIdle();
        return;
      }
      if(go === 'ch4'){
        // ? : ch4_1 파트로 바로 이동 (어둡게 + 호러 BGM + 어서오세요)
        if(!gameStarted) gameStarted = true;
        document.body.classList.add('finale', 'goWork');
        document.body.style.overflow = 'hidden';
        window.scrollTo(0,0);
        document.body.classList.remove('clearStage', 'showS1', 'dlgDone', 'leaving');
        setChImage('ch4_1.png');
        document.body.classList.add('darkch4');
        playHorrorBG();
        dlgIndex = 23;
        showDialogue(dlgIndex);
        document.body.classList.add('playing');
        resetIdle();
        return;
      }
    });
  });
  // 손님 첫 등장 장면으로 바로 이동 (s_1 + 스캐너 대사)
  function goCustomer(){
    if(!gameStarted) gameStarted = true;
    document.body.classList.add('finale', 'goWork');
    document.body.style.overflow = 'hidden';
    window.scrollTo(0,0);
    setSImage('s_1.png');
    document.body.classList.add('showS1');
    dlgIndex = 4;
    showDialogue(dlgIndex);
    document.body.classList.add('playing');
    resetIdle();
  }
  // 캐릭터 장면으로 바로 이동 (ch 이미지 + 해당 첫 대사)
  function goChapter(imgSrc, idx){
    if(!gameStarted) gameStarted = true;
    document.body.classList.add('finale', 'goWork');
    document.body.style.overflow = 'hidden';
    window.scrollTo(0,0);
    document.body.classList.remove('clearStage', 'showS1', 'dlgDone', 'leaving', 'hideCh');
    setChImage(imgSrc);
    dlgIndex = idx;
    showDialogue(dlgIndex);
    document.body.classList.add('playing');
    resetIdle();
  }

  // 비닐 내려놓는 소리 (Web Audio 합성, 짧게)
  function playPutDown(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      // 쿵 (낮은 타격음)
      const o = ctx.createOscillator();
      const og = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t0);
      o.frequency.exponentialRampToValueAtTime(60, t0 + 0.18);
      og.gain.setValueAtTime(0.0001, t0);
      og.gain.exponentialRampToValueAtTime(0.3, t0 + 0.015);
      og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);

      // 사락 (짧은 비닐 스침)

      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2500; bp.Q.value = 0.7;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.0001, t0 + 0.05);
      ng.gain.exponentialRampToValueAtTime(0.12, t0 + 0.12);
      ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.4);
      const src = ctx.createBufferSource(); src.buffer = buf;

  // 음산한 배경 음악 (낮은 불협 드론 + 기괴한 떨림, 무한 반복)
  let horrorOn = false;
  let horrorNodes = null;
  function playHorrorBG(){
    if(horrorOn) return;
    horrorOn = true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const master = ctx.createGain();
      master.gain.value = 0.3;
      master.connect(ctx.destination);
      const nodes = [];
      // 낮은 불협 드론
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 280;
      const dg = ctx.createGain(); dg.gain.value = 0.009;
      lp.connect(dg); dg.connect(master);
      [[55, 'sawtooth'], [58.27, 'sawtooth'], [110.5, 'sine']].forEach(([f, t])=>{
        const o = ctx.createOscillator(); o.type = t; o.frequency.value = f;
        o.connect(lp); o.start(); nodes.push(o);
      });
      // 느린 호흡
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.07;
      const lg = ctx.createGain(); lg.gain.value = 0.005;
      lfo.connect(lg); lg.connect(dg.gain); lfo.start(); nodes.push(lfo);
      // 높은 기괴한 떨림 (단2도 beating)
      const hg = ctx.createGain(); hg.gain.value = 0.0015;
      hg.connect(master);
      [1244.5, 1318.5].forEach((f)=>{
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        o.connect(hg); o.start(); nodes.push(o);
      });
      const tlfo = ctx.createOscillator(); tlfo.frequency.value = 0.13;
      const tg = ctx.createGain(); tg.gain.value = 0.001;
      tlfo.connect(tg); tlfo.connect(hg.gain); tlfo.start(); nodes.push(tlfo);
      horrorNodes = { ctx, nodes };
    }catch(e){ /* 오디오 실패 무시 */ }
  }
  function stopHorrorBG(){
    if(!horrorNodes) return;
    try{
      horrorNodes.nodes.forEach((o)=>{ try{ o.stop(); }catch(e){} });
      if(horrorNodes.ctx && horrorNodes.ctx.close){ horrorNodes.ctx.close(); }
    }catch(e){ /* 무시 */ }
    horrorNodes = null;
    horrorOn = false;
  }

  // 자동문 스르륵 열림+닫힘 (Web Audio 합성)
  function playAutoDoor(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      function slide(start, sweepTo, dur){
        const len = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.5;
        bp.frequency.setValueAtTime(400, start);
        bp.frequency.linearRampToValueAtTime(sweepTo, start + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.2, start + dur * 0.3);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        const src = ctx.createBufferSource(); src.buffer = buf;
        src.connect(bp).connect(g).connect(ctx.destination);
        src.start(start); src.stop(start + dur + 0.05);
      }
      slide(t0, 2200, 0.7);      // 열림
      slide(t0 + 0.9, 400, 0.7); // 닫힘
    }catch(e){ /* 오디오 실패 무시 */ }
  }

  // 손님이 물건 고르는 부드러운 바스락 소리 (Web Audio 합성)
  function playRustle(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return 0;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      const dur = 1.6;
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * 0.7;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      let t = t0;
      const end = t0 + dur;
      while(t < end){
        const peak = 0.04 + Math.random()*0.08;
        const bl = 0.08 + Math.random()*0.14;
        g.gain.exponentialRampToValueAtTime(peak, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, Math.min(t + bl, end));
        t += bl + Math.random()*0.12;
      }
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      src.connect(bp).connect(g).connect(ctx.destination);
      src.start(t0); src.stop(end + 0.05);
    }catch(e){ /* 오디오 실패 무시 */ }
    return 1600; // 효과음 전체 길이(ms)
  }

  function playRing(){

      const AC = window.AudioContext || window.webkitAudioContext;

  function playVibe(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      const ctx = new AC();
      const t0 = ctx.currentTime + 0.02;
      [0, 0.32].forEach((off)=>{
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 155;
        const t = t0 + off;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        for(let k = 0; k < 5; k++){
          g.gain.exponentialRampToValueAtTime(0.1, t + 0.02 + (k * 2 + 1) * 0.025);
          g.gain.exponentialRampToValueAtTime(0.3, t + 0.02 + (k * 2 + 2) * 0.025);
        }
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        o.connect(g).connect(ctx.destination);
        o.start(t); o.stop(t + 0.3);
      });
    }catch(e){ /* 오디오 실패 무시 */ }
  }

            }, 2000);
          }, 200);
        }, 150); // s_3 완전 퇴장 후 잠시 대기
      }, 200);
      return;
    }
    if(dlgIndex === 13){
      // 어서오세요(마침표) 클릭: 손님? / 명령하지마라
      dlgIndex = 14;
      showDialogue(dlgIndex);
      return;
    }
    if(dlgIndex === 17){
      // 뭐? 클릭: 콜라 하나 줘 대화창으로
      dlgIndex = 16;
      showDialogue(dlgIndex);
      return;
    }
    if(dlgIndex === 22){
      // 신고 대사 클릭: 대화창 먼저 꺼지게 + 0.25초 뒤 ch3_1만 퇴장 + 나가는 소리 (s_5 유지)
      document.body.classList.add('dlgDone');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      setTimeout(()=>{
        const cImg = document.querySelector('#ch1-wrap img');
        cImg.style.animation = 'slideOutUp .2s ease both';
        playAutoDoor();
        setTimeout(()=>{
          document.body.classList.add('hideCh');
          cImg.style.animation = '';
          // s_5만 남은 ch_3 상황에서도 하... 대화창 표시
          dlgIndex = 25;
          showDialogue(dlgIndex);
          maybeNextCustomer();
        }, 200);
      }, 250);
      return;
    }
    if(dlgIndex === 18){
      // 에잉 대사 클릭: s_5 등장 + 스캐너 대는 부분으로
      document.body.classList.add('dlgDone');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      s6on = false;
      setSImage('s_5.png');
      document.body.classList.add('showS1', 'canScan');
      return;
    }
    if(dlgIndex === 14){
      // 명령하지마라 클릭: ch3_1 등장 후 진상 대사
      const cImg = document.querySelector('#ch1-wrap img');
      const test = new Image();
      test.onload = ()=>{
        document.body.classList.remove('clearStage');
        cImg.src = 'ch3_1.png';
        cImg.style.animation = 'none';
        void cImg.offsetWidth;
        cImg.style.animation = '';
        setTimeout(()=>{
          dlgIndex = 15;
          showDialogue(dlgIndex);
        }, 800);
      };
      test.onerror = ()=>{
        // 파일이 없어도 흐름 진행
        dlgIndex = 15;
        showDialogue(dlgIndex);
      };
      test.src = 'ch3_1.png';
      return;
    }
    if(dlgIndex === 21){
      // 쯧 대화창 클릭: 대화창 사라지게 (자동 퇴장이 끝났으면 생략)
      document.body.classList.add('dlgDone');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      if(!exited21) exit21();
      return;
    }
    if(dlgIndex === 24){
      // ..? 클릭: ch 없고 game_3 기본 상태면 하... 대화창으로
      const chHidden = getComputedStyle(document.querySelector('#ch1-wrap')).display === 'none';
      const g33 = document.querySelector('#game33img');
      const cur = g33 ? (g33.getAttribute('src') || '') : '';
      const isBase = cur.indexOf('game_3.png') !== -1;
      if(chHidden && isBase){
        dlgIndex = 25;
        showDialogue(dlgIndex);
      }
      return;
    }
    if(dlgIndex === 35){
      // 핸드폰 울린다 클릭: 대화창 사라지게
      document.body.classList.add('dlgDone');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      return;
    }
    if(dlgIndex === 34){
      // 퇴사한다고 대화창 클릭: 대화창 사라지게 (호버 가능해짐)
      document.body.classList.add('dlgDone');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      return;
    }
    if(dlgIndex === 23){
      // 어서오세요 클릭: 대화창 사라지게 + game_3_2 이상이면 3초 간격으로 game_3까지 내림
      document.body.classList.add('dlgDone');
      document.body.classList.remove('showClick');
      clearTimeout(idleTimer);
      if(stepping23) return;
      stepping23 = true;
      (function step(){
        const g33 = document.querySelector('#game33img');
        const cur = g33 ? (g33.getAttribute('src') || '') : '';
        const hi = cur.indexOf('game_3_2.png') !== -1 || cur.indexOf('game_3_3.png') !== -1 || cur.indexOf('game_3_4.png') !== -1;
        if(!hi){
          stepping23 = false;
          setTimeout(revertToBG, 3000); // 다 내려가면 3초 뒤 원래 화면으로
          return;
        }
        stepDownGame3();
        setTimeout(step, 3000);
      })();
      return;
    }
    if(dlgIndex >= dialogues.length - 1) return;
    dlgIndex++;
    showDialogue(dlgIndex);
    if(dlgIndex === 3) setChImage('ch1_2.png');
  });
  // 원래 화면으로 복귀 (game_1 배경만, 캐릭터 없음, 소리 정지) + ..? 대사
  function revertToBG(){
    stopHorrorBG();
    document.body.classList.add('clearStage', 'dlgDone');
    document.body.classList.remove('showS1', 'darkch4', 'zoomch4', 'showClick', 'showChoices');
    clearTimeout(idleTimer);
    dlgIndex = 24;
    showDialogue(dlgIndex);
  }
  // 퇴근 홈 진입 (game_4 + s_9 + 1초 뒤 지정 대사)
  function enterQuitHome(dlgIdx){
    stopHorrorBG();
    quitWait = true;
    document.body.classList.add('dlgDone', 'goHome', 'clearStage');
    document.body.classList.remove('showS1', 'darkch4', 'zoomch4');
    clearTimeout(idleTimer);
    layoutS9();
    setTimeout(()=>{
      quitWait = false;
      dlgIndex = dlgIdx;
      showDialogue(dlgIndex);
    }, 1000);
  }
  // game_3 오버레이 뒷 숫자 하나씩 감소 (3_4→3_3→3_2→game_3)
  function stepDownGame3(){
    const g33 = document.querySelector('#game33img');
    if(!g33) return;
    const cur = g33.getAttribute('src') || '';
    const target = cur.indexOf('game_3_4.png') !== -1 ? 'game_3_3.png' : (cur.indexOf('game_3_3.png') !== -1 ? 'game_3_2.png' : (cur.indexOf('game_3_2.png') !== -1 ? 'game_3.png' : null));
    if(!target) return;
    const gtest = new Image();
    gtest.onload = ()=>{ g33.src = target; };
    gtest.src = target;
  }
  // 쯧 이후 이미지 차례 퇴장 (s_5 → ch3_1 + 나가는 소리)
  function exit21(){
    exited21 = true;
    const sImg = document.querySelector('#s1-wrap img');
    sImg.style.animation = 'slideOutUp .2s ease both';
    setTimeout(()=>{
      document.body.classList.remove('showS1');
      sImg.style.animation = '';
      setTimeout(()=>{
        const cImg = document.querySelector('#ch1-wrap img');
        cImg.style.animation = 'slideOutUp .2s ease both';
        playAutoDoor();
        setTimeout(()=>{
          document.body.classList.add('clearStage');
          cImg.style.animation = '';
          maybeNextCustomer();
          // s_5 없고 game_3 기본이면 하... 대화창
          const sShown = document.body.classList.contains('showS1');
          const g33 = document.querySelector('#game33img');
          const cur = g33 ? (g33.getAttribute('src') || '') : '';
          if(!sShown && cur.indexOf('game_3.png') !== -1){
            dlgIndex = 25;
            showDialogue(dlgIndex);
          }
        }, 200);
      }, 150); // s_5 완전 퇴장 후 잠시 대기
    }, 200);
  }
  // ch3_1 퇴장 후 game_3_2 이상이면 다음 손님 (2초 대기 + 대기 중 s_5 숨김, 띵동 + ch4_1)
  function maybeNextCustomer(){
    const g33 = document.querySelector('#game33img');
    const cur = g33 ? (g33.getAttribute('src') || '') : '';
    const hi = cur.indexOf('game_3_2.png') !== -1 || cur.indexOf('game_3_3.png') !== -1 || cur.indexOf('game_3_4.png') !== -1;
    if(!hi) return;
    setTimeout(()=>{
      if(sCurrent === 's_5.png' || sCurrent === 's_6.png'){
        document.body.classList.remove('showS1');
      }
      playDoorJingle();
      const cImg = document.querySelector('#ch1-wrap img');
      const test = new Image();
      test.onload = ()=>{
        document.body.classList.remove('clearStage');
        cImg.src = 'ch4_1.png';
        cImg.style.animation = 'none';
        void cImg.offsetWidth;
        cImg.style.animation = '';
        document.body.classList.add('darkch4');
        playHorrorBG();
        setTimeout(()=>{
          dlgIndex = 23;
          showDialogue(dlgIndex);
        }, 800);
      };
      test.onerror = ()=>{ /* 파일 없으면 유지 */ };
      test.src = 'ch4_1.png';
    }, 2000);
  }
  document.querySelectorAll('.choice-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      playClick();
      document.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      if(btn.dataset.choice === 'yes'){
        if(dlgIndex === 1){ dlgIndex = 2; showDialogue(dlgIndex); }
        else if(dlgIndex === 3){ dlgIndex = 2; showDialogue(dlgIndex); setChImage('ch1_1.png'); }
        else if(dlgIndex === 5){ dlgIndex = 7; showDialogue(dlgIndex); }
        else if(dlgIndex === 6){ dlgIndex = 7; showDialogue(dlgIndex); }
        else if(dlgIndex === 8){ dlgIndex = 9; showDialogue(dlgIndex); }
        else if(dlgIndex === 15){ dlgIndex = 16; showDialogue(dlgIndex); }
        else if(dlgIndex === 28){ dlgIndex = 29; showDialogue(dlgIndex); }
        else if(dlgIndex === 32){
          // 못 해먹겠습니다-line 퇴근하기: 화면 전환 + 1초 뒤 울린다 대사 + 전화벨
          stopHorrorBG();
          quitWait = true;
          document.body.classList.add('dlgDone', 'goHome', 'clearStage');
          document.body.classList.remove('showS1', 'darkch4', 'zoomch4');
          clearTimeout(idleTimer);
          layoutS9();
          setTimeout(()=>{
            quitWait = false;
            playVibe();
            dlgIndex = 35;
            showDialogue(dlgIndex);
          }, 1000);
        }
        else if(dlgIndex === 33){
          // 괜찮습니다-line 퇴근하기: 일단 퇴근하기와 동일 경로
          enterQuitHome(34);
        }
        else if(dlgIndex === 26){
          // 직접 말하기: 대화창 꺼지게 + 문 열리는 소리 후 ch1_1 등장, 점장 대사
          document.body.classList.add('dlgDone');
          document.body.classList.remove('showClick');
          clearTimeout(idleTimer);
          document.body.classList.remove('showS1');
          playDoorOpen();
          const cImg = document.querySelector('#ch1-wrap img');
          const test = new Image();
          const showCh1 = ()=>{
            document.body.classList.remove('clearStage', 'hideCh');
            setTimeout(()=>{ dlgIndex = 27; showDialogue(dlgIndex); }, 800);
          };
          test.onload = ()=>{ cImg.src = 'ch1_1.png'; showCh1(); };
          test.onerror = ()=>{ showCh1(); };
          test.src = 'ch1_1.png';
        }
        else if(dlgIndex === 20){
          dlgIndex = 21; showDialogue(dlgIndex);
          playCashReg();
          stepDownGame3();
        }
        else if(dlgIndex === 16){
          dlgIndex = 18; showDialogue(dlgIndex);
          stepDownGame3();
        }
      } else {
        if(dlgIndex === 1){ dlgIndex = 3; showDialogue(dlgIndex); setChImage('ch1_2.png'); }
        else if(dlgIndex === 3){ dlgIndex = 2; showDialogue(dlgIndex); setChImage('ch1_1.png'); }
        else if(dlgIndex === 5){ dlgIndex = 6; showDialogue(dlgIndex); }
        else if(dlgIndex === 8){ dlgIndex = 2; showDialogue(dlgIndex); setChImage('ch1_1.png'); }
        else if(dlgIndex === 28){ dlgIndex = 33; showDialogue(dlgIndex); }
        else if(dlgIndex === 26){
          // 일단 퇴근하기 경로: game_4 + s_9 + 퇴사한다고 문자로 말하자
          enterQuitHome(34);
        }
        else if(dlgIndex === 15){
          dlgIndex = 17; showDialogue(dlgIndex);
          stepDownGame3();
        }
        else if(dlgIndex === 16){
          // (가져다 준다.): 대화창 사라지게 + s_5 등장
          document.body.classList.add('dlgDone');
          document.body.classList.remove('showClick');
          clearTimeout(idleTimer);
          s6on = false;
          setSImage('s_5.png');
          document.body.classList.add('showS1', 'canScan');
        }
        else if(dlgIndex === 20){
          // 안 팔아!!!! : 신고 대사 + 숫자 감소 (퇴장은 대화창 클릭 시)
          dlgIndex = 22; showDialogue(dlgIndex);
          stepDownGame3();
        }
      }
    });
  });
</script>
</body>
</html>
