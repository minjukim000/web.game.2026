/* game1.html의 chat.png 기반 대화창 구성과 위치를 그대로 적용 */
.board-dialog{position:fixed;left:50%;bottom:0;width:min(96vw,1250px);aspect-ratio:2048 / 684;transform:translate(-50%,8%);z-index:20;color:#f6f2eb;text-shadow:1px 2px 0 #111;font-family:'Galmuri11',monospace;cursor:pointer;user-select:none}
.board-dialog[hidden]{display:none}
.board-dialog:not([hidden]){animation:boardSlideUp .48s cubic-bezier(.22,1,.36,1) both}

/* game1.html 선택창과 동일한 픽셀 테두리, 커서, 호버 스타일 */
.trash-choices{position:fixed;z-index:25;right:calc((100vw - min(96vw,1250px))/2 + 56px);bottom:clamp(165px,24vw,320px);width:clamp(210px,22vw,285px);padding:10px 9px;background:#292929;border:4px solid #e9e9e9;outline:3px solid #171717;box-shadow:inset 3px 3px 0 #777,inset -3px -3px 0 #101010,5px 5px 0 #111;font-family:'Galmuri11',monospace;image-rendering:pixelated}
.trash-choices[hidden]{display:none}
.trash-choices:not([hidden]){animation:trashChoiceAppear .16s steps(3,end) both}
@keyframes trashChoiceAppear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.trash-choices .choice-option{width:100%;display:flex;align-items:center;gap:9px;border:0;border-radius:0;background:transparent;color:#f5f5f5;font-family:'Galmuri11',monospace;font-size:clamp(17px,1.7vw,24px);text-align:left;padding:6px 8px;cursor:pointer}

.trash-choices .choice-option.is-selected .choice-cursor,.trash-choices .choice-option:hover .choice-cursor,.trash-choices .choice-option:focus-visible .choice-cursor{visibility:visible}

/* web_intro 날짜 타이핑 인트로 */

function playStorageLockedRattle(stronger=false){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  if(!doorAudioContext)doorAudioContext=new C();
  const ac=doorAudioContext;if(ac.state==='suspended')ac.resume().catch(()=>{});
  const now=ac.currentTime,rate=ac.sampleRate,duration=stronger?.65:.43;
  const buffer=ac.createBuffer(1,Math.ceil(rate*duration),rate),data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++){
   const t=i/rate;let amp=0;
   for(const beat of (stronger?[.02,.19,.36,.52]:[.02,.20]))amp+=Math.exp(-Math.max(0,t-beat)*43)*(t>=beat?1:0);
   data[i]=(Math.random()*2-1)*Math.min(1,amp)*.65;
  }
  const src=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();
  filter.type='bandpass';filter.frequency.value=stronger?1250:920;filter.Q.value=1.1;
  gain.gain.value=.35;src.buffer=buffer;src.connect(filter);filter.connect(gain);gain.connect(ac.destination);src.start(now);
 }catch(_){} // The cutscene continues even when audio is blocked.
}

let doorAudioContext;
function playDoorOpenSound(){
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    if(!doorAudioContext)doorAudioContext=new AudioContextClass();
    if(doorAudioContext.state==='suspended')doorAudioContext.resume().catch(()=>{});
    const now=doorAudioContext.currentTime;
    // 낮은 문고리 딸깍 소리와 문이 열리는 짧은 마찰음
    const duration=.34, sampleRate=doorAudioContext.sampleRate;
    const buffer=doorAudioContext.createBuffer(1,Math.ceil(sampleRate*duration),sampleRate);
    const data=buffer.getChannelData(0);
    let noise=0;
    for(let i=0;i<data.length;i++){
      const t=i/sampleRate;
      noise=noise*.86+(Math.random()*2-1)*.14;
      const click=(t<.055?Math.exp(-t*65)*.85:0);
      const creak=(t>.065?Math.sin(2*Math.PI*(185-95*t)*t)*Math.exp(-(t-.065)*9)*.26:0);
      data[i]=Math.max(-1,Math.min(1,noise*click+creak));
    }
    const source=doorAudioContext.createBufferSource();source.buffer=buffer;
    const gain=doorAudioContext.createGain();gain.gain.value=.32;
    source.connect(gain);gain.connect(doorAudioContext.destination);
    source.start(now);
  }catch(err){/* 오디오가 차단되어도 맵 이동은 계속 진행 */}
}
// 회장실 문: 열쇠를 꽂고 돌린 뒤 잠금장치가 풀리는 금속성 소리.

function playChairmanKeyUnlockSound(){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    if(!doorAudioContext)doorAudioContext=new C();
    const ac=doorAudioContext;
    if(ac.state==='suspended')ac.resume().catch(()=>{});
    const start=ac.currentTime;
    // 열쇠 삽입, 회전, 잠금 해제 순으로 짧은 금속성 클릭을 배치합니다.
    for(const [offset,frequency,duration,level] of [
      [0,1250,.045,.10],[.10,760,.075,.085],[.24,520,.11,.12],[.40,920,.055,.09]
    ]){
      const osc=ac.createOscillator(),gain=ac.createGain();
      osc.type='triangle';
      osc.frequency.setValueAtTime(frequency,start+offset);
      osc.frequency.exponentialRampToValueAtTime(frequency*.62,start+offset+duration);
      gain.gain.setValueAtTime(.0001,start+offset);
      gain.gain.linearRampToValueAtTime(level,start+offset+.007);
      gain.gain.exponentialRampToValueAtTime(.0001,start+offset+duration);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start(start+offset);osc.stop(start+offset+duration+.005);
    }
    // 열쇠가 돌아가는 동안 들리는 약한 금속 마찰음.
    const duration=.33,buffer=ac.createBuffer(1,Math.ceil(ac.sampleRate*duration),ac.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++){
      const t=i/ac.sampleRate;
      data[i]=(Math.random()*2-1)*Math.sin(Math.PI*t/duration)**2*.12;
    }
    const source=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();
    source.buffer=buffer;filter.type='bandpass';filter.frequency.value=2350;filter.Q.value=1.6;
    gain.gain.value=.12;
    source.connect(filter);filter.connect(gain);gain.connect(ac.destination);
    source.start(start+.08);
  }catch(err){/* 오디오 재생에 실패해도 회장실 입장은 유지 */}
}

function playElevatorDing(){
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass)return;
    if(!doorAudioContext)doorAudioContext=new AudioContextClass();
    if(doorAudioContext.state==='suspended')doorAudioContext.resume().catch(()=>{});
    const ctx=doorAudioContext,now=ctx.currentTime;
    // 두 배음이 겹치며 부드럽게 감쇠하는 금속성 엘리베이터 벨
    for(const [frequency,level] of [[880,.12],[1320,.045],[1760,.018]]){
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.type='sine';osc.frequency.setValueAtTime(frequency,now);
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.linearRampToValueAtTime(level,now+.014);
      gain.gain.exponentialRampToValueAtTime(.0001,now+1.05);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(now);osc.stop(now+1.07);
    }
  }catch(err){/* 오디오 차단 시에도 맵 이동은 정상 동작 */}
}

let trashChoiceAudio=null;
function playTrashChoiceTick(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!trashChoiceAudio)trashChoiceAudio=new AudioContextClass();
  if(trashChoiceAudio.state==='suspended')trashChoiceAudio.resume();
  const now=trashChoiceAudio.currentTime;
  const osc=trashChoiceAudio.createOscillator();
  const gain=trashChoiceAudio.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(900,now);
  osc.frequency.exponentialRampToValueAtTime(510,now+0.035);
  gain.gain.setValueAtTime(0.085,now);
  gain.gain.exponentialRampToValueAtTime(0.001,now+0.045);
  osc.connect(gain);gain.connect(trashChoiceAudio.destination);
  osc.start(now);osc.stop(now+0.05);
}
// 쓰레기통 안의 종이/잡동사니를 뒤적이는 바스락거림 (별도 음원 불필요)
function playTrashRummageSound(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  if(!trashChoiceAudio)trashChoiceAudio=new C();
  if(trashChoiceAudio.state==='suspended')trashChoiceAudio.resume();
  const ac=trashChoiceAudio,now=ac.currentTime,rate=ac.sampleRate;
  const duration=1.25,buffer=ac.createBuffer(1,Math.ceil(rate*duration),rate),data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;
  const source=ac.createBufferSource();source.buffer=buffer;
  const filter=ac.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1700;filter.Q.value=.65;
  const gain=ac.createGain();gain.gain.setValueAtTime(.0001,now);
  // 여러 차례 뒤적이는 불규칙한 바스락 소리
  [[.03,.15],[.16,.015],[.27,.20],[.40,.018],[.55,.14],[.67,.015],[.79,.19],[.94,.02],[1.05,.11],[1.24,.0001]].forEach(([t,v])=>gain.gain.linearRampToValueAtTime(v,now+t));
  source.connect(filter);filter.connect(gain);gain.connect(ac.destination);
  source.start(now);source.stop(now+duration);
}
// 아이템 획득을 알리는 짧은 상승 8비트 효과음
function playTrashKeySound(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  if(!trashChoiceAudio)trashChoiceAudio=new C();
  if(trashChoiceAudio.state==='suspended')trashChoiceAudio.resume();
  const ac=trashChoiceAudio,now=ac.currentTime;
  [659.25,880,1174.66].forEach((hz,i)=>{
    const t=now+i*.115,osc=ac.createOscillator(),gain=ac.createGain();
    osc.type='square';osc.frequency.value=hz;
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.linearRampToValueAtTime(.065,t+.012);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.22);
    osc.connect(gain);gain.connect(ac.destination);osc.start(t);osc.stop(t+.23);
  });
}

 storageKeyObtained=!!state.storageKeyObtained;

 plantDialogIndex=-1;

<script>
/* web_intro(2).html과 동일한 글자 간격, 시작 지연 및 타이핑 소리 합성 */
(()=>{
'use strict';
const MESSAGE='20XX년 2월 7일 오후 10시', SPEED=125, START_DELAY=650;
const overlay=document.getElementById('mapDateIntro');
const text=document.getElementById('mapDateText'),cursor=document.getElementById('mapDateCursor');
const guide=document.getElementById('mapDateGuide'),soundNote=document.getElementById('mapDateSoundNote');
let index=0,finished=false,timer=null,ctx=null,noiseBuffer=null,masterGain=null;
function enableSound(){
 try{
  if(!ctx){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;ctx=new AudioContextClass();masterGain=ctx.createGain();masterGain.gain.value=.6;masterGain.connect(ctx.destination);}
  if(ctx.state==='suspended')ctx.resume().catch(()=>{});
  soundNote.style.display='none';
 }catch(e){}
}
function typingSound(){
 if(!ctx||ctx.state!=='running')return;
 if(!noiseBuffer){noiseBuffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*.025),ctx.sampleRate);const samples=noiseBuffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=(Math.random()*2-1)*Math.pow(1-i/samples.length,4);}
 const now=ctx.currentTime,source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
 source.buffer=noiseBuffer;filter.type='bandpass';filter.frequency.value=1600+Math.random()*400;filter.Q.value=.8;
 gain.gain.setValueAtTime(.035,now);gain.gain.exponentialRampToValueAtTime(.001,now+.025);
 source.connect(filter);filter.connect(gain);gain.connect(masterGain);source.start(now);source.stop(now+.025);
}
function finish(){finished=true;clearTimeout(timer);cursor.style.display='none';guide.classList.add('visible');}
function typeNext(){const chars=Array.from(MESSAGE);if(index>=chars.length){finish();return;}const ch=chars[index++];text.textContent+=ch;if(ch.trim())typingSound();timer=setTimeout(typeNext,SPEED);}
function dismiss(showOpeningDialog=true){
 clearTimeout(timer);overlay.hidden=true;window.mapDateIntroActive=false;
 if(ctx&&ctx.state==='running')ctx.suspend().catch(()=>{});
 if(showOpeningDialog){
  // 기존 chat.png 대화창을 재사용하며, 첫 클릭으로 닫히도록 마지막 단계에 둡니다.
  const dialog=document.getElementById('boardDialog');
  const line=document.getElementById('boardLine');
  if(dialog&&line){
   boardDialogIndex=boardRules.length-1;
   dialog.querySelector('.board-speaker').textContent='-';
   line.textContent='(회사 안으로 들어가자)';
   clickPath=[];keys.clear();
   dialog.hidden=false;
  }
 }
}
window.mapDateIntroActive=true;
window.mapDateIntroDismiss=dismiss;
// 인트로가 보이는 동안 지도에 클릭·키 입력이 전달되지 않도록 차단
for(const eventName of ['pointerdown','pointerup','click','dblclick','contextmenu','wheel']){
 overlay.addEventListener(eventName,e=>{
  e.stopPropagation();if(eventName==='pointerdown')enableSound();
  if(eventName==='click'){if(!finished){text.textContent=MESSAGE;finish();}else dismiss(true);}
 });
}
window.addEventListener('keydown',e=>{if(!window.mapDateIntroActive)return;enableSound();if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!finished){text.textContent=MESSAGE;finish();}else dismiss(true);}else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','e','Shift'].includes(e.key)){e.preventDefault();}e.stopImmediatePropagation();},true);
timer=setTimeout(typeNext,START_DELAY);
})();
</script>
<script>
// 챕터 1 엔딩 저장 메뉴: 저장 완료 후 '돌아가기'를 누르면 메인 화면으로 이동.
(function(){
 let endingSaved=false;
 window.addEventListener('message',function(event){
   if(typeof storageEndingPhase==='undefined'||storageEndingPhase!==6)return;
   const overlay=document.getElementById('gw-esc-overlay');
   const iframe=overlay?.querySelector('iframe');
   if(!iframe||event.source!==iframe.contentWindow)return;
   const data=event.data||{};
   if(data.type==='GW_ESC_SAVE'){
     const slot=Number(data.slot);
     if(Number.isInteger(slot)&&slot>=1&&slot<=10){
       // 브리지의 저장 처리가 성공한 경우에만 이동 허용.
       setTimeout(function(){
         try{
           const saved=JSON.parse(localStorage.getItem('gwisimu_save_v2_'+slot)||'null');
           if(saved?.state?.chapterOneEnding)endingSaved=true;
         }catch(_){}
       },0);
     }
   }else if(data.type==='GWISIMU_ESC_CLOSE'&&endingSaved){
     event.stopImmediatePropagation();
     location.href='index.html';
   }
 },true);
})();
</script>
