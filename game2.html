<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>귀시무담 - 편의점</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:#000 url('game_1.png') center/contain no-repeat fixed;color:#f6f2eb;font-family:'Galmuri11',monospace;user-select:none;-webkit-user-select:none}
#ch1-wrap{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ch1-wrap img{display:block;width:100vw;height:100vh;object-fit:contain;animation:ch1in 1.5s cubic-bezier(.22,1,.36,1) both}
@keyframes ch1in{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
#dialogueOverlay{position:fixed;left:50%;bottom:0;width:min(96vw,1250px);aspect-ratio:2048/684;transform:translate(-50%,8%);z-index:20;font-family:'Galmuri11',monospace;color:#f6f2eb;text-shadow:1px 2px 0 #111;animation:dialogueSlideUp .48s cubic-bezier(.22,1,.36,1) both}
@keyframes dialogueSlideUp{from{opacity:0;transform:translate(-50%,45%)}to{opacity:1;transform:translate(-50%,8%)}}
#dialogueOverlay>img:first-child{display:block;width:100%;height:100%;image-rendering:pixelated}
#dialoguePortrait{position:absolute;left:6.2%;top:30.2%;width:12.9%;height:39.1%;object-fit:cover;object-position:center 31%;image-rendering:pixelated;pointer-events:none}
#dialogueName{position:absolute;left:20%;top:25%;width:15%;text-align:center;font-size:clamp(11px,1.35vw,18px);white-space:nowrap}
#dialogueText{position:absolute;left:24%;top:43%;font-size:clamp(13px,1.65vw,23px);letter-spacing:.02em;white-space:pre-line}
@media(max-width:600px){#dialogueOverlay{width:115vw}#dialogueName{font-size:10px}#dialogueText{font-size:12px}}
#ch1-wrap.hidden,#dialogueOverlay.hidden{display:none!important}
</style>
</head>
<body>
<div id="ch1-wrap"><img src="ch1_1.png" alt="편의점 점장 첫 장면"></div>
<div id="dialogueOverlay" aria-live="polite"><img src="chat.png" alt=""><img id="dialoguePortrait" src="c_2.png" alt="편의점 점장"><span id="dialogueName">편의점 점장</span><span id="dialogueText">감사합니다!</span></div>
<script>
(function(){
  let step=0;
  document.addEventListener('click',function(event){
    if(step===0){
      document.getElementById('dialogueText').textContent='손님은 안 올거예요.\n1시간만 채워주시고 가주세요!';
      step=1;
    }else if(step===1){
      document.getElementById('ch1-wrap').classList.add('hidden');
      document.getElementById('dialogueOverlay').classList.add('hidden');
      step=2;
    }
  });
})();
</script>
</body>
</html>
