<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>귀시무담 | 메뉴</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css"><style>
@import url("https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css");
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#09090a url('game.png') center/cover fixed no-repeat;color:#f5f1ed;font-family:'Galmuri11','Galmuri9',monospace;image-rendering:pixelated}body:before{content:'';position:fixed;inset:0;background:#0006;pointer-events:none}button{font:inherit;color:inherit;cursor:pointer}.screen{position:relative;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:35px 16px}.shell{width:min(940px,95vw);filter:drop-shadow(0 7px 0 #080808)}.frame{border:3px solid #e6e6e6;box-shadow:inset 0 0 0 3px #262626,0 0 0 3px #222;background:repeating-linear-gradient(to bottom,#545454 0,#545454 6px,#515151 6px,#515151 12px,#4b4b4b 12px,#4b4b4b 18px)}.heading{min-height:74px;padding:17px 24px;font-size:clamp(22px,3vw,33px);text-shadow:3px 3px #191919;display:flex;align-items:center}.divider{height:16px}.bodylayout{display:grid;grid-template-columns:minmax(160px,29%) minmax(0,1fr);gap:16px;align-items:stretch}.menu{display:flex;flex-direction:column;padding:0;min-height:410px}.nav{border:0;border-bottom:3px solid #888;background:transparent;text-align:left;padding:23px 12px;font-size:clamp(17px,2.2vw,23px);min-height:96px}.nav:last-child{border-bottom:0}.nav:before{content:'▶';display:inline-block;width:24px;visibility:hidden}.nav:hover,.nav:focus-visible,.nav.active{background:#e8e8e8;color:#222;outline:0}.nav:hover:before,.nav:focus-visible:before,.nav.active:before{visibility:visible}.main{padding:25px 26px;min-height:410px}.sectiontitle{font-size:clamp(19px,2.6vw,25px);margin:0 0 22px;text-shadow:2px 2px #171717}.panel{display:none}.panel.active{display:block}.itemgrid{display:flex;flex-direction:column;gap:9px}.item{width:100%;min-height:55px;background:#303030;border:2px solid #8a8a8a;display:flex;align-items:center;justify-content:flex-start;padding:12px 18px;color:#f1f1f1;font-size:clamp(15px,1.8vw,19px);text-align:left}.item:hover,.item:focus-visible{background:#e6e6e6;color:#222;outline:0}.desc{font-size:15px;line-height:1.7;margin-top:16px;min-height:45px}.slot{width:100%;min-height:110px;padding:18px 22px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:15px}.slot:hover,.slot:focus-visible{filter:brightness(1.22);outline:0}.slot strong{font-size:clamp(20px,2.8vw,27px)}.slot small{display:block;margin-top:9px;font-size:15px}.status{font-size:16px}.help{font-size:15px;line-height:2}.footer{margin-top:23px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;text-shadow:1px 1px #000}.close{border:2px solid #bdbdbd;background:#252525c9;padding:9px 18px;font-size:16px}.close:hover,.close:focus-visible{background:#e6e6e6;color:#111;outline:0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#333;border:3px solid #eee;padding:14px;display:none;z-index:20;max-width:90vw;text-align:center}.toast.show{display:block}@media(max-width:600px){.screen{padding:15px 8px}.heading{min-height:60px}.bodylayout{grid-template-columns:30% minmax(0,1fr);gap:9px}.menu{min-height:350px}.nav{min-height:80px;padding:15px 2px;font-size:clamp(12px,3vw,16px)}.nav:before{width:16px}.main{padding:15px 12px;min-height:350px}.item{font-size:13px;min-height:48px;padding:10px 12px}.footer{font-size:12px}.close{font-size:13px}.slot{padding:12px 8px}.slot strong{font-size:15px}.slot small{font-size:11px}.help{font-size:12px}}
.slots-scroll{height:clamp(210px,43vh,390px);overflow-y:auto;overscroll-behavior:contain;margin:14px 0 0;padding:3px 9px 3px 3px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:#d4d4d4 #343434}.slots-scroll::-webkit-scrollbar{width:10px}.slots-scroll::-webkit-scrollbar-track{background:#343434}.slots-scroll::-webkit-scrollbar-thumb{background:#c4c4c4;border:2px solid #343434}.slot{flex-shrink:0}@media(max-width:600px){.slots-scroll{height:clamp(190px,40vh,310px)}.slot{min-height:88px}.status{font-size:12px}}
</style></head><body>
<div class="screen"><div class="shell"><header class="frame heading">메뉴</header><div class="divider"></div><div class="bodylayout"><nav class="frame menu" aria-label="메뉴"><button class="nav" data-tab="save">세이브</button><button class="nav active" data-tab="items">아이템</button><button class="nav" data-tab="help">조작 안내</button><button class="nav" data-tab="exit">게임 복귀</button></nav><main class="frame main"><h1 class="sectiontitle" id="heading">소지품</h1><section class="panel active" id="items"><div class="itemgrid" id="itemgrid"></div></section><section class="panel" id="save"><div class="help">저장할 세이브 파일을 선택하세요.</div><div id="slots" class="slots-scroll"></div></section><section class="panel" id="help"><div class="help">W A S D / 방향키 : 이동<br>마우스 클릭 : 이동 / 조사<br>E : 상호작용<br>ESC : 메뉴 열기 / 닫기<br>F3 : 충돌 영역 확인</div></section><section class="panel" id="exit"><div class="help">메뉴를 닫고 게임으로 돌아갑니다.</div><button class="close" id="returnButton">게임으로 돌아가기</button></section></main></div><div class="footer"><span id="status">소지품 0개</span><button class="close" id="closeButton">돌아가기</button></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
// 게임 화면에서 ESC로 열면 실제 진행 상태를 저장합니다.
let menuAudio;
function ensureMenuAudio(){try{if(!menuAudio)menuAudio=new (window.AudioContext||window.webkitAudioContext)();if(menuAudio.state==='suspended')menuAudio.resume().catch(()=>{});}catch(_){}}
function playMenuTick(){if(!menuAudio||menuAudio.state!=='running')return;const t=menuAudio.currentTime,o=menuAudio.createOscillator(),g=menuAudio.createGain();o.type='square';o.frequency.setValueAtTime(900,t);o.frequency.exponentialRampToValueAtTime(510,t+.035);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.045);o.connect(g);g.connect(menuAudio.destination);o.start(t);o.stop(t+.05);}
document.addEventListener('pointerdown',ensureMenuAudio,{capture:true});document.addEventListener('keydown',ensureMenuAudio,{capture:true});
document.addEventListener('pointerover',e=>{const b=e.target.closest('button');if(b&&!b.contains(e.relatedTarget))playMenuTick()});document.addEventListener('click',e=>{if(e.target.closest('button')){ensureMenuAudio();playMenuTick()}},true);
const params=new URLSearchParams(location.search);
const grid=document.getElementById('itemgrid');
let currentSnapshot=null;
function renderItems(){
 const state=currentSnapshot?.state;
 const ownedItems=[
  {name:'열쇠',owned:!!(state?.trashKeyObtained || (!currentSnapshot && params.get('key')==='1')),description:'화장실에서 발견한 열쇠'},
  {name:'창고 열쇠',owned:!!state?.storageKeyObtained,description:'회장실 화분에서 발견한 창고 열쇠'},
   {name:'카드키',owned:!!state?.storageCardKeyObtained,description:'창고 서랍장에서 발견한 카드키'}
 ];
 grid.replaceChildren();
 for(const item of ownedItems.filter(item=>item.owned)){
  const button=document.createElement('button');
  button.type='button';button.className='item';button.textContent=item.name;
  button.title=item.description;
  grid.append(button);
 }
 document.getElementById('status').textContent='소지품 '+ownedItems.filter(item=>item.owned).length+'개';
}

renderItems();
const titles={items:'소지품',save:'세이브',help:'조작 안내',exit:'게임 복귀'};
function setTab(tab){document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab));document.getElementById('heading').textContent=titles[tab];if(tab==='save')renderSlots();}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.tab==='exit'){closeMenu();return;}setTab(b.dataset.tab)}));
const storageKey='gwisimu_save_v2_';
window.addEventListener('message',e=>{if(e.source!==window.parent)return;const d=e.data||{};if(d.type==='GW_ESC_STATE'){currentSnapshot=d.snapshot;renderItems();renderSlots()}else if(d.type==='GW_ESC_SAVED'){notify('세이브 파일 '+d.slot+'에 저장했습니다.');renderSlots()}else if(d.type==='GW_ESC_ERROR'){notify(d.message)}});
function readSlot(i){try{return JSON.parse(localStorage.getItem(storageKey+i)||'null')}catch{return null}}
function renderSlots(){const root=document.getElementById('slots');root.replaceChildren();for(let i=1;i<=10;i++){const s=readSlot(i);const b=document.createElement('button');b.type='button';b.className='frame slot';const left=document.createElement('span');const strong=document.createElement('strong');strong.textContent='세이브 파일 '+i;const small=document.createElement('small');small.textContent=s?'CHAPTER '+(Number(s.chapter)||1)+(s.chapterTitle?' · '+s.chapterTitle:'')+' | '+new Date(s.at).toLocaleString('ko-KR')+' · '+s.page+(s.state?.scene?' · MAP '+s.state.scene:''):'빈 저장 파일';left.append(strong,small);const status=document.createElement('span');status.className='status';status.textContent=s?'덮어쓰기':'저장';b.append(left,status);b.onclick=()=>{if(s&&!confirm('세이브 파일 '+i+'을 덮어쓰시겠습니까?'))return;if(window.parent===window){notify('게임 화면에서 ESC 메뉴를 열어 저장해주세요.');return}window.parent.postMessage({type:'GW_ESC_SAVE',slot:i},'*')};root.append(b)}}
window.parent!==window&&window.parent.postMessage({type:'GW_ESC_GET_STATE'},'*');
let toastTimer;function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2700)}
function closeMenu(){if(window.parent!==window){window.parent.postMessage({type:'GWISIMU_ESC_CLOSE'},'*')}else{notify('단독 미리보기입니다. 게임에 연결하면 ESC로 복귀합니다.')}}
document.getElementById('closeButton').onclick=closeMenu;document.getElementById('returnButton').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();closeMenu()}else if((e.key==='ArrowUp'||e.key==='ArrowDown')&&document.activeElement.classList.contains('nav')){e.preventDefault();const a=[...document.querySelectorAll('.nav')];a[(a.indexOf(document.activeElement)+(e.key==='ArrowDown'?1:-1)+a.length)%a.length].focus()}});
</script></body></html>
